<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920, height=1080"/>
  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1920px; height:1080px; overflow:hidden; background:#0c0b09; font-family:inter,sans-serif; }

    .scene {
      width:1920px; height:1080px;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }

    .glow {
      position:absolute;
      width:900px; height:900px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(0,191,165,0.2) 0%, transparent 65%);
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }

    .streaks { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    .sk {
      position:absolute; width:3px; height:200%; top:-50%; left:0;
      background: linear-gradient(to bottom, transparent 0%, rgba(0,191,165,0.7) 40%, rgba(255,255,255,0.9) 50%, rgba(0,191,165,0.7) 60%, transparent 100%);
      transform: rotate(18deg); opacity:0;
    }

    .eyebrow {
      font-size:28px; letter-spacing:8px; text-transform:uppercase;
      color:rgba(0,219,190,0.8);
      margin-bottom:40px;
      opacity:0;
    }

    .num-wrap {
      position:relative;
      display:flex; align-items:center; justify-content:center;
    }

    .ring {
      position:absolute;
      width:460px; height:460px;
      border-radius:50%;
      border:2px solid rgba(0,191,165,0.5);
      top:50%; left:50%;
      transform:translate(-50%,-50%) scale(0.9);
      opacity:0;
      pointer-events:none;
    }

    .big-number {
      font-family:'playfair display', serif;
      font-size:340px; line-height:1;
      color:#00bfa5;
      opacity:0;
      position:relative;
    }

    .percent {
      font-family:'playfair display', serif;
      font-size:160px; color:#00bfa5;
      vertical-align:super; line-height:1;
    }

    .caption {
      font-size:52px; font-weight:300;
      color:rgba(250,248,243,0.75);
      margin-top:32px;
      letter-spacing:1px;
      opacity:0;
      max-width:1000px; text-align:center; line-height:1.4;
    }

    .rule {
      width:0; height:2px;
      background:#00bfa5;
      margin:40px auto 0;
      opacity:0.5;
    }
  </style>
</head>
<body>
<div class="scene" id="scene" data-composition-id="beat-1-hook" data-width="1920" data-height="1080">
  <div class="glow"></div>
  <div class="streaks">
    <div class="sk" id="sk1"></div>
    <div class="sk" id="sk2"></div>
  </div>
  <p class="eyebrow" id="eyebrow">A story about connection</p>
  <div class="num-wrap">
    <div class="ring" id="ring"></div>
    <div class="big-number" id="num">49<span class="percent">%</span></div>
  </div>
  <div class="rule" id="rule"></div>
  <p class="caption" id="cap">of adults now have 3 or fewer close friends</p>
</div>

<script>
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  gsap.set('#sk1', { x:-200 });
  gsap.set('#sk2', { x:-400 });

  tl
    .to('#scene', { scale:1, opacity:1, duration:0.5, ease:'power2.out' }, 0)
    .from('#scene', { scale:0.92 }, 0)

    .to('#eyebrow', { opacity:1, y:0, duration:0.5, ease:'power2.out' }, 0.2)
    .from('#eyebrow', { y:20 }, 0.2)

    .to('#num', { opacity:1, scale:1, duration:0.6, ease:'expo.out' }, 0.6)
    .from('#num', { scale:0.7 }, 0.6)

    .to('#ring', { opacity:0.5, scale:1, duration:0.4, ease:'power2.out' }, 0.9)
    .to('#ring', { scale:1.1, opacity:0, duration:0.7, ease:'power1.out', repeat:2, yoyo:false }, 1.3)

    .to('#sk1', { x:2400, opacity:0.7, duration:1.4, ease:'power1.inOut' }, 0.3)
    .to('#sk1', { opacity:0, duration:0.4 }, 1.5)
    .to('#sk2', { x:2600, opacity:0.5, duration:1.6, ease:'power1.inOut' }, 0.55)
    .to('#sk2', { opacity:0, duration:0.4 }, 2.0)

    .to('#rule', { width:320, opacity:0.5, duration:0.5, ease:'power2.out' }, 1.1)

    .to('#cap', { opacity:1, y:0, duration:0.5, ease:'power2.out' }, 1.3)
    .from('#cap', { y:20 }, 1.3)

    .to('#scene', { opacity:0, duration:0.4, ease:'power2.in' }, 3.6);

  window.__timelines["beat-1-hook"] = tl;
</script>
</body>
</html>
