00%</text><text fill="#CCCCCC" style="font-size:2.4mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:normal;" text-anchor="start" x="5.5" y="21.7">CDR:100%  AI:×1.0  PS:100%</text><g id="txt_0"><text fill="#1E1E1E" style="font-size:3.1769999999999996mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="25.0">床前明月光，疑是地上霜。举头望明月，低头思故乡。</text><text fill="#1E1E1E" style="font-size:3.1769999999999996mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="28.177">春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。</text><text fill="#1E1E1E" style="font-size:3.1769999999999996mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="31.354">欲穷千里目，更上一层楼。白日依山尽，黄河入海流。</text><text fill="#1E1E1E" style="font-size:3.1769999999999996mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="34.531">海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。</text><text fill="#1E1E1E" style="font-size:3.1769999999999996mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="37.708">会当凌绝顶，一览众山小。荡胸生层云，决眦入归鸟。</text></g><rect fill="none" height="137.0" opacity="1" rx="1.5" stroke="#C0BBB2" stroke-width="0.4" width="136.5" x="3.5" y="16.0" /><rect fill="#2A5580" height="6.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="136.5" x="141.5" y="16.0" /><text fill="#FFFFFF" style="font-size:3.5mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="143.5" y="19.5">9pt  行距 125%</text><text fill="#CCCCCC" style="font-size:2.4mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:normal;" text-anchor="start" x="143.5" y="21.7">CDR:125%  AI:×1.25  PS:125%</text><g id="txt_1"><text fill="#1E1E1E" style="font-size:3.1769999999999996mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="143.5" y="25.0">床前明月光，疑是地上霜。举头望明月，低头思故乡。</text><text fill="#1E1E1E" style="font-size:3.1769999999999996mm;font-family:SimSun, STSon