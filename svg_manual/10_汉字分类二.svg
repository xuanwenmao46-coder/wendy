<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 420 297" width="420mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><g id="page"><rect fill="#F9F7F3" height="297" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="0" /><rect fill="#161616" height="14" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="0" /><rect fill="#E8C86A" height="0.5" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="14" /><circle cx="9" cy="7" fill="#E8C86A" r="4.5" /><text fill="#161616" style="font-size:4.2mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:bold;" text-anchor="middle" x="9" y="9.2">10</text><text fill="#F5F0E1" style="font-size:5.2mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="18" y="7.8">汉字字体分类编排（二）古体·过渡·混合·展示·超类别</text><text fill="#A09890" style="font-size:3.2mm;font-family:SimHei, STHeiti, sans-serif;font-weight:normal;" text-anchor="start" x="18" y="12.2">字库参考：方正字库 / 汉仪字库 / 文鼎字库  ·  示例文本：中国古典诗词</text><rect fill="#E8E5DE" height="6" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="291" /><line stroke="#C0BBB2" stroke-width="0.3" x1="0" x2="420" y1="291" y2="291" /><text fill="#6B6560" style="font-size:2.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5" y="295">汉字字体分类 / Chinese Type Classification  ·  字体版权归各字库厂商所有</text><text fill="#A8A29C" style="font-size:2.6mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:normal;" text-anchor="end" x="415" y="295">Typography Design Manual  ·  A3 420×297mm</text><rect fill="#4A2878" height="7.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="204.0" x="4.0" y="15.5" /><text fill="#FFFFFF" style="font-size:4.6mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="8.0" y="20.8">古体 / 过渡体 Transitional</text><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="24.0" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="27.6">方正楷体  FZ KaiTi</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:KaiTi, STKaiti, cursive;font-weight:normal;" text-anchor="start" x="6.0" y="35.02">但愿人长久，千里共婵娟。明月几时有，把酒问青天。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="37.89" y2="37.89" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="40.39" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="43.99">文鼎隶书  WT LiShu</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:STKaiti, serif;font-weight:normal;" text-anchor="start" x="6.0" y="51.41">落霞与孤鹜齐飞，秋水共长天一色。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="54.28" y2="54.28" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="56.78" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="60.38">汉仪魏碑  HY WeiBei</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="6.0" y="67.8">羌笛何须怨杨柳，春风不度玉门关。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="70.67" y2="70.67" /><rect fill="#2E6630" height="7.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="204.0" x="210.0" y="15.5" /><text fill="#FFFFFF" style="font-size:4.6mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="214.0" y="20.8">混合体 Hybrid</text><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="24.0" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="27.6">方正综艺体  FZ ZongYi</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:STXingkai, cursive;font-weight:normal;" text-anchor="start" x="212.0" y="35.02">桃花潭水深千尺，不及汪伦送我情。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="37.89" y2="37.89" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="40.39" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="43.99">汉仪综艺体  HY ZongYi</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:STXingkai, cursive;font-weight:normal;" text-anchor="start" x="212.0" y="51.41">横看成岭侧成峰，远近高低各不同。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="54.28" y2="54.28" /><rect fill="#8C2646" height="7.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="204.0" x="4.0" y="76.17" /><text fill="#FFFFFF" style="font-size:4.6mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="8.0" y="81.47">展示体 Display</text><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="84.67" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="88.27">方正粗圆  FZ CuYuan</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimHei, STHeiti, sans-serif;font-weight:normal;" text-anchor="start" x="6.0" y="95.69">长风破浪会有时，直挂云帆济沧海。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="98.56" y2="98.56" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="101.06" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="104.66">汉仪展宋  HY ZhanSong</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="6.0" y="112.08">仰天大笑出门去，我辈岂是蓬蒿人。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="114.95" y2="114.95" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="117.45" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="121.05">文鼎特明体  WT TeMing</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="6.0" y="128.47">安得广厦千万间，大庇天下寒士俱欢颜。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="131.34" y2="131.34" /><rect fill="#444444" height="7.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="204.0" x="210.0" y="59.78" /><text fill="#FFFFFF" style="font-size:4.6mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="214.0" y="65.08">超类别体 Super-Family</text><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="68.28" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="71.88">方正超粗黑  FZ ChaoHei</text><text fill="#1E1E1E" style="font-size:7.0mm;font-family:SimHei, STHeiti, sans-serif;font-weight:normal;" text-anchor="start" x="212.0" y="80.38">黄沙百战穿金甲，不破楼兰终不还。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="83.43" y2="83.43" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="85.93" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="89.53">汉仪超黑  HY ChaoHei</text><text fill="#1E1E1E" style="font-size:7.0mm;font-family:SimHei, STHeiti, sans-serif;font-weight:normal;" text-anchor="start" x="212.0" y="98.03">羌笛何须怨杨柳，春风不度玉门关。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="101.08000000000001" y2="101.08000000000001" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="103.58000000000001" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="107.18">文鼎超圆  WT ChaoYuan</text><text fill="#1E1E1E" style="font-size:7.0mm;font-family:Microsoft YaHei, PingFang SC, sans-serif;font-weight:normal;" text-anchor="start" x="212.0" y="115.68">秦时明月汉时关，万里长征人未还。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="118.73000000000002" y2="118.73000000000002" /></g></svg>