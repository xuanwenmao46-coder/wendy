<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 420 297" width="420mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><g id="page"><rect fill="#F9F7F3" height="297" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="0" /><rect fill="#161616" height="14" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="0" /><rect fill="#E8C86A" height="0.5" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="14" /><circle cx="9" cy="7" fill="#E8C86A" r="4.5" /><text fill="#161616" style="font-size:4.2mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:bold;" text-anchor="middle" x="9" y="9.2">09</text><text fill="#F5F0E1" style="font-size:5.2mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="18" y="7.8">汉字字体分类编排（一）有衬线·无衬线·圆体·手写体</text><text fill="#A09890" style="font-size:3.2mm;font-family:SimHei, STHeiti, sans-serif;font-weight:normal;" text-anchor="start" x="18" y="12.2">字库参考：方正字库 / 汉仪字库 / 文鼎字库  ·  示例文本：中国古典诗词</text><rect fill="#E8E5DE" height="6" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="291" /><line stroke="#C0BBB2" stroke-width="0.3" x1="0" x2="420" y1="291" y2="291" /><text fill="#6B6560" style="font-size:2.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5" y="295">汉字字体分类 / Chinese Type Classification  ·  字体版权归各字库厂商所有</text><text fill="#A8A29C" style="font-size:2.6mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:normal;" text-anchor="end" x="415" y="295">Typography Design Manual  ·  A3 420×297mm</text><rect fill="#7A2A20" height="7.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="204.0" x="4.0" y="15.5" /><text fill="#FFFFFF" style="font-size:4.6mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="8.0" y="20.8">有衬线体 Serif</text><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="24.0" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="27.6">方正书宋  FZ ShuSong</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="6.0" y="35.02">白日依山尽，黄河入海流。欲穷千里目，更上一层楼。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="37.89" y2="37.89" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="40.39" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="43.99">方正仿宋  FZ FangSong</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:FangSong, STFangsong, serif;font-weight:normal;" text-anchor="start" x="6.0" y="51.41">海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="54.28" y2="54.28" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="56.78" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="60.38">汉仪中宋  HY ZhongSong</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="6.0" y="67.8">大漠孤烟直，长河落日圆。萧关逢候骑，都护在燕然。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="70.67" y2="70.67" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="73.17" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="76.77">文鼎细宋  WT XiSong</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="6.0" y="84.19">春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="87.06" y2="87.06" /><rect fill="#1E4A8A" height="7.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="204.0" x="210.0" y="15.5" /><text fill="#FFFFFF" style="font-size:4.6mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="214.0" y="20.8">无衬线体 Sans-Serif</text><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="24.0" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="27.6">方正黑体  FZ HeiTi</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimHei, STHeiti, sans-serif;font-weight:normal;" text-anchor="start" x="212.0" y="35.02">会当凌绝顶，一览众山小。荡胸生层云，决眦入归鸟。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="37.89" y2="37.89" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="40.39" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="43.99">汉仪黑体  HY HeiTi</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:SimHei, STHeiti, sans-serif;font-weight:normal;" text-anchor="start" x="212.0" y="51.41">举头望明月，低头思故乡。床前明月光，疑是地上霜。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="54.28" y2="54.28" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="56.78" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="60.38">方正兰亭黑  FZ LanTingHei</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:Microsoft YaHei, PingFang SC, sans-serif;font-weight:normal;" text-anchor="start" x="212.0" y="67.8">烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="70.67" y2="70.67" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="73.17" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="76.77">文鼎中黑  WT ZhongHei</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:Microsoft YaHei, PingFang SC, sans-serif;font-weight:normal;" text-anchor="start" x="212.0" y="84.19">随风潜入夜，润物细无声。好雨知时节，当春乃发生。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="87.06" y2="87.06" /><rect fill="#1A6E4A" height="7.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="204.0" x="4.0" y="92.56" /><text fill="#FFFFFF" style="font-size:4.6mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="8.0" y="97.86">圆体 Rounded</text><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="101.06" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="104.66">方正准圆  FZ ZhunYuan</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:Microsoft YaHei, PingFang SC, sans-serif;font-weight:normal;" text-anchor="start" x="6.0" y="112.08">两岸猿声啼不住，轻舟已过万重山。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="114.95" y2="114.95" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="117.45" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="121.05">汉仪圆体  HY YuanTi</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:Microsoft YaHei, PingFang SC, sans-serif;font-weight:normal;" text-anchor="start" x="6.0" y="128.47">黄河之水天上来，奔流到海不复回。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="131.34" y2="131.34" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="5.0" y="133.84" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="7.0" y="137.44">文鼎圆体  WT YuanTi</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:Microsoft YaHei, PingFang SC, sans-serif;font-weight:normal;" text-anchor="start" x="6.0" y="144.86">天生我材必有用，千金散尽还复来。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="5.0" x2="207.0" y1="147.73000000000002" y2="147.73000000000002" /><rect fill="#8A4510" height="7.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="204.0" x="210.0" y="92.56" /><text fill="#FFFFFF" style="font-size:4.6mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="214.0" y="97.86">手写体 Script</text><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="101.06" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="104.66">方正行楷  FZ XingKai</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:STXingkai, KaiTi, cursive;font-weight:normal;" text-anchor="start" x="212.0" y="112.08">问君能有几多愁，恰似一江春水向东流。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="114.95" y2="114.95" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="117.45" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="121.05">汉仪行楷  HY XingKai</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:KaiTi, STKaiti, cursive;font-weight:normal;" text-anchor="start" x="212.0" y="128.47">无边落木萧萧下，不尽长江滚滚来。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="131.34" y2="131.34" /><rect fill="#EDE9E0" height="5" opacity="1" rx="0.8" stroke="none" stroke-width="0.2" width="202.0" x="211.0" y="133.84" /><text fill="#6B5535" style="font-size:3.0mm;font-family:SimSun, STSong, serif;font-weight:bold;" text-anchor="start" x="213.0" y="137.44">文鼎行书  WT XingShu</text><text fill="#1E1E1E" style="font-size:5.8mm;font-family:STKaiti, KaiTi, cursive;font-weight:normal;" text-anchor="start" x="212.0" y="144.86">飞流直下三千尺，疑是银河落九天。</text><line stroke="#C8C3BA" stroke-width="0.18" x1="211.0" x2="413.0" y1="147.73000000000002" y2="147.73000000000002" /></g></svg>