<svg baseProfile="full" height="297mm" version="1.1" viewBox="0 0 420 297" width="420mm" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><g id="page"><rect fill="#F9F7F3" height="297" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="0" /><rect fill="#161616" height="14" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="0" /><rect fill="#E8C86A" height="0.5" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="14" /><circle cx="9" cy="7" fill="#E8C86A" r="4.5" /><text fill="#161616" style="font-size:4.2mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:bold;" text-anchor="middle" x="9" y="9.2">14</text><text fill="#F5F0E1" style="font-size:5.2mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="18" y="7.8">宋体行距实验（二）· 10pt / 12pt × 行距 100%–200%</text><text fill="#A09890" style="font-size:3.2mm;font-family:SimHei, STHeiti, sans-serif;font-weight:normal;" text-anchor="start" x="18" y="12.2">字号增大时行距配合关系  ·  对比 10pt 与 12pt 的版面节奏差异</text><rect fill="#E8E5DE" height="6" opacity="1" rx="0" stroke="none" stroke-width="0.2" width="420" x="0" y="291" /><line stroke="#C0BBB2" stroke-width="0.3" x1="0" x2="420" y1="291" y2="291" /><text fill="#6B6560" style="font-size:2.8mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5" y="295">行距实验 / Line Spacing  ·  宋体 SimSun  ·  CDR=CorelDRAW  AI=Illustrator  PS=Photoshop</text><text fill="#A8A29C" style="font-size:2.6mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:normal;" text-anchor="end" x="415" y="295">Typography Design Manual  ·  A3 420×297mm</text><rect fill="#3E3268" height="6.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="136.5" x="3.5" y="16.0" /><text fill="#FFFFFF" style="font-size:3.5mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="5.5" y="19.5">10pt 行距 100%</text><text fill="#CCCCCC" style="font-size:2.4mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:normal;" text-anchor="start" x="5.5" y="21.7">CDR:100%  AI:×1.0  PS:100%</text><g id="txt_0"><text fill="#1E1E1E" style="font-size:3.53mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="25.0">床前明月光，疑是地上霜。举头望明月，低头思故乡。</text><text fill="#1E1E1E" style="font-size:3.53mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="28.53">春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。</text><text fill="#1E1E1E" style="font-size:3.53mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="32.06">欲穷千里目，更上一层楼。白日依山尽，黄河入海流。</text><text fill="#1E1E1E" style="font-size:3.53mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="35.59">海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。</text><text fill="#1E1E1E" style="font-size:3.53mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="5.5" y="39.12">会当凌绝顶，一览众山小。荡胸生层云，决眦入归鸟。</text></g><rect fill="none" height="137.0" opacity="1" rx="1.5" stroke="#C0BBB2" stroke-width="0.4" width="136.5" x="3.5" y="16.0" /><rect fill="#2A5580" height="6.5" opacity="1" rx="1.5" stroke="none" stroke-width="0.2" width="136.5" x="141.5" y="16.0" /><text fill="#FFFFFF" style="font-size:3.5mm;font-family:SimHei, STHeiti, sans-serif;font-weight:bold;" text-anchor="start" x="143.5" y="19.5">10pt 行距 150%</text><text fill="#CCCCCC" style="font-size:2.4mm;font-family:Helvetica Neue, Arial, sans-serif;font-weight:normal;" text-anchor="start" x="143.5" y="21.7">CDR:150%  AI:×1.5  PS:150%</text><g id="txt_1"><text fill="#1E1E1E" style="font-size:3.53mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="143.5" y="25.0">床前明月光，疑是地上霜。举头望明月，低头思故乡。</text><text fill="#1E1E1E" style="font-size:3.53mm;font-family:SimSun, STSong, serif;font-weight:normal;" text-anchor="start" x="143.5" y="30.295">春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知