<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Line Infographic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#111;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }

  /* ── Intro / Outro overlay ── */
  #overlay {
    position:fixed; inset:0; background:#111;
    pointer-events:none; z-index:999;
    animation:overlayAnim 6s linear forwards;
  }
  @keyframes overlayAnim {
    0%     { opacity:1; }
    8.33%  { opacity:0; }
    75%    { opacity:0; }
    91.67% { opacity:1; }
    100%   { opacity:1; }
  }

  /* ── Content outro ── */
  .scene-content {
    transform-origin:center top;
    animation:contentOut 0.5s ease 4.5s both;
  }
  @keyframes contentOut {
    to { opacity:0; transform:translateY(-10px) scale(0.97); }
  }

  /* ── Layout ── */
  .scene { width:960px; padding:40px 20px 50px; }

  .header {
    display:flex; align-items:baseline; gap:12px;
    margin-bottom:8px; overflow:hidden;
  }
  .chart-title {
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic; font-size:28px; font-weight:400;
    color:#fff; white-space:nowrap;
    opacity:0; animation:fadeIn 0.4s ease 1.1s forwards;
  }
  .title-rule {
    flex:1; height:1px; background:rgba(255,255,255,0.4);
    transform-origin:left; transform:scaleX(0);
    animation:growRule 0.4s ease 1.2s forwards;
  }
  .chart-subtitle {
    font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    color:rgba(255,255,255,0.5); white-space:nowrap;
    opacity:0; animation:fadeIn 0.3s ease 1.3s forwards;
  }

  .stats {
    display:flex; justify-content:flex-start; gap:60px;
    margin:20px 0 24px 60px;
  }
  .stat-item { display:flex; flex-direction:column; }
  .stat-pct {
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic; font-weight:700; font-size:52px;
    color:#fff; line-height:1;
    opacity:0; animation:fadeIn 0.4s ease 2.7s forwards;
  }
  .stat-pct.s2 { color:rgba(255,255,255,0.55); }
  .stat-pct.s3 { color:rgba(255,255,255,0.3); }
  .stat-label {
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:rgba(255,255,255,0.5); margin-top:4px;
    opacity:0; animation:fadeIn 0.4s ease 2.8s forwards;
  }

  .chart-svg { display:block; }

  /* grid / axes / labels each delayed +0.5s vs original */
  .grid-line  { opacity:0; animation:fadeIn 0.4s ease 0.5s forwards; }
  .axis-line  { opacity:0; animation:fadeIn 0.4s ease 0.8s forwards; }
  .axis-label { opacity:0; animation:fadeIn 0.3s ease 1.0s forwards; }

  .series-line {
    fill:none;
    stroke-dasharray:var(--len, 9999);
    stroke-dashoffset:var(--len, 9999);
    animation:drawLine 1.6s ease-in-out 1.3s forwards;
  }
  @keyframes drawLine { to { stroke-dashoffset:0; } }

  .dot { opacity:0; animation:popIn 0.2s ease forwards; }
  @keyframes popIn { to { opacity:1; } }

  @keyframes fadeIn   { to { opacity:1; } }
  @keyframes growRule { to { transform:scaleX(1); } }
</style>
</head>
<body>
<div id="overlay"></div>
<div class="scene">
  <div class="scene-content">
    <div class="header">
      <div class="chart-title">Infographics classic</div>
      <div class="title-rule"></div>
      <div class="chart-subtitle">12x3 months</div>
    </div>

    <div class="stats">

      <polyline id="s1" class="series-line"

      <circle class="dot" cx="60"  cy="314" r="5" fill="#fff" stroke="#111" stroke-width="1.5" style="animation-delay:1.30s"/>

      <!-- Dots Series 2 -->
      <circle class="dot" cx="60"  cy="266" r="5" fill="rgba(255,255,255,0.55)" stroke="#111" stroke-width="1.5" style="animation-delay:1.30s"/>
      <circle class="dot" cx="136" cy="250" r="5" fill="rgba(255,255,255,0.55)" stroke="#111" stroke-width="1.5" style="animation-delay:1.45s"/>

      <!-- Dots Series 3 -->

      <circle class="dot" cx="136" cy="314" r="5" fill="rgba(255,255,255,0.3)" stroke="#111" stroke-width="1.5" style="animation-delay:1.45s"/>
      <circle class="dot" cx="212" cy="324" r="5" fill="rgba(255,255,255,0.3)" stroke="#111" stroke-width="1.5" style="animation-delay:1.60s"/>

    </svg>
  </div>
</div>
<script>
  document.querySelectorAll('.series-line').forEach(el => {
    const len = el.getTotalLength ? el.getTotalLength() : 1200;
    el.style.setProperty('--len', len);
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
  });
</script>
</body>
</html>
