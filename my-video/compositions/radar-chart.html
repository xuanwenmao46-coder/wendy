<title>Radar Chart — DATA COMPARISON</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  #root{
    position:relative;width:1920px;height:1080px;overflow:hidden;
    font-family:'Inter','Arial',sans-serif;
  }
  #bg{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
  }
  #overlay{
    position:absolute;inset:0;
    background:rgba(4,8,20,0.62);
  }
  /* Title */
  #title-wrap{
    position:absolute;top:48px;left:50%;
    display:flex;flex-direction:column;align-items:center;
    opacity:0;
  }
  #title-badge{
    background:rgba(8,14,36,0.82);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    padding:18px 56px 14px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 4px 40px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.08);
    text-align:center;
    white-space:nowrap;
  }
  #title-badge .label{
    font-size:13px;letter-spacing:6px;color:rgba(180,200,240,0.55);
    text-transform:uppercase;margin-bottom:6px;
    font-weight:500;
  }
  #title-badge .main{
    font-size:52px;font-weight:800;letter-spacing:3px;
    color:#fff;text-transform:uppercase;
    text-shadow:0 2px 24px rgba(60,120,255,0.35);
    line-height:1;
  }
  #title-badge .sub{
    font-size:13px;letter-spacing:5px;color:rgba(180,200,240,0.45);
    text-transform:uppercase;margin-top:8px;font-weight:400;
  }

  /* SVG radar */
  #radar-svg{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) translateY(20px);
    overflow:visible;
  }

  /* Legend */
  #legend{
    position:absolute;bottom:58px;left:50%;
    display:flex;gap:48px;align-items:center;
    background:rgba(6,12,30,0.72);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:40px;
    padding:16px 48px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;
    white-space:nowrap;
  }
  .leg-item{
    display:flex;align-items:center;gap:12px;
  }
  .leg-line{
    width:32px;height:3px;border-radius:2px;
  }
  .leg-label{
    font-size:16px;font-weight:600;color:rgba(220,235,255,0.85);
    letter-spacing:1px;
  }
</style>

<script>
(function(){
  'use strict';

  /* ── Radar Math ── */
  const AXES = ['AUSTRALIA','BRAZIL','CANADA','CHINA','FRANCE','GERMANY','INDIA','ITALY','JAPAN'];
  const N = AXES.length;
  const MAX_R = 310;
  const LABEL_R = 355;

  function pt(r, i) {
    var angle = (i * 2 * Math.PI / N) - (Math.PI / 2);
    return [r * Math.cos(angle), r * Math.sin(angle)];
  }

  function polyPoints(values) {
    var pts = [];
    for (var i = 0; i < N; i++) {
      var r = (values[i] / 100) * MAX_R;
      var p = pt(r, i);
      pts.push(p[0].toFixed(2) + ',' + p[1].toFixed(2));
    }
    return pts.join(' ');
  }

  /* ── Data ── */
  var data = {
    2022: [75, 65, 80, 72, 58, 62, 70, 68, 82],
    2021: [68, 82, 58, 76, 82, 48, 62, 78, 62],
    2020: [48, 68, 72, 55, 90, 76, 48, 55, 68],
    2019: [55, 48, 62, 42, 68, 88, 78, 42, 52]
  };

  /* ── Build Grid Rings ── */
  var ringIds = ['ring1','ring2','ring3','ring4','ring5'];
  for (var ri = 0; ri < 5; ri++) {
    var rr = MAX_R * (ri + 1) / 5;
    var rPts = [];
    for (var i = 0; i < N; i++) {
      var p = pt(rr, i);
      rPts.push(p[0].toFixed(2) + ',' + p[1].toFixed(2));
    }
    document.getElementById(ringIds[ri]).setAttribute('points', rPts.join(' '));
  }

  /* ── Build Axis Lines ── */
  var axisG = document.getElementById('axis-lines');
  for (var i = 0; i < N; i++) {
    var outer = pt(MAX_R, i);
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1','0'); line.setAttribute('y1','0');
    line.setAttribute('x2', outer[0].toFixed(2));
    line.setAttribute('y2', outer[1].toFixed(2));
    line.setAttribute('stroke','rgba(180,200,255,0.18)');
    line.setAttribute('stroke-width','1');
    axisG.appendChild(line);
  }

  /* ── Build Axis Labels ── */
  var labelG = document.getElementById('axis-labels');
  for (var i = 0; i < N; i++) {
    var lp = pt(LABEL_R, i);
    var text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', lp[0].toFixed(2));
    text.setAttribute('y', lp[1].toFixed(2));
    text.textContent = AXES[i];
    /* adjust anchor for left/right labels */
    var angle = (i * 360 / N);
    if (angle > 10 && angle < 170) text.setAttribute('text-anchor','start');
    else if (angle > 190 && angle < 350) text.setAttribute('text-anchor','end');
    labelG.appendChild(text);
  }

  /* ── Build Ring % Labels ── */
  var ringLblG = document.getElementById('ring-labels');
  var pcts = [20,40,60,80,100];
  for (var ri = 0; ri < pcts.length; ri++) {
    var rr = MAX_R * (ri + 1) / 5;
    var lp = pt(rr, 0);
    var text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', (lp[0] + 6).toFixed(2));
    text.setAttribute('y', (lp[1] - 6).toFixed(2));
    text.textContent = pcts[ri] + '%';
    ringLblG.appendChild(text);
  }

  /* ── Set Polygon Points ── */
  document.getElementById('poly2022').setAttribute('points', polyPoints(data[2022]));
  document.getElementById('poly2021').setAttribute('points', polyPoints(data[2021]));
  document.getElementById('poly2020').setAttribute('points', polyPoints(data[2020]));
  document.getElementById('poly2019').setAttribute('points', polyPoints(data[2019]));

  /* ── Build Data Dots ── */
  function buildDots(groupId, values, color) {
    var g = document.getElementById(groupId);
    for (var i = 0; i < N; i++) {
      var r = (values[i] / 100) * MAX_R;
      var p = pt(r, i);
      var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', p[0].toFixed(2));
      c.setAttribute('cy', p[1].toFixed(2));
      c.setAttribute('r','5');
      c.setAttribute('fill',color);
      c.setAttribute('stroke','rgba(255,255,255,0.6)');
      c.setAttribute('stroke-width','1.5');
      g.appendChild(c);
    }
  }
  buildDots('dots2022', data[2022], '#00c87a');
  buildDots('dots2021', data[2021], '#ff3378');
  buildDots('dots2020', data[2020], '#9933ff');
  buildDots('dots2019', data[2019], '#ffc800');

  /* ── GSAP Timeline ── */
  var tl = gsap.timeline({ paused: true });

  /* t=0: overlay + bg fade in */
  tl.from('#overlay', { opacity: 0, duration: 0.8, ease: 'power2.out' }, 0);
  tl.from('#bg', { opacity: 0, scale: 1.06, transformOrigin: '50% 50%', duration: 1.5, ease: 'power2.out' }, 0);

  /* t=0.4: title slides down */
  tl.fromTo('#title-wrap', { xPercent: -50, opacity: 0 }, { xPercent: -50, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.4);
  tl.from('#title-badge', { y: -40, duration: 0.55, ease: 'back.out(1.3)' }, 0.4);

  /* t=0.7: radar grid */
  tl.to('#grid-rings', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.7);
  tl.to('#axis-lines', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.75);
  tl.to('#ring-labels', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.9);
  tl.to('#center-dot', { opacity: 1, duration: 0.3 }, 0.9);

  /* t=1.0: axis labels stagger */
  tl.to('#axis-labels', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 1.0);
  var labelTexts = document.querySelectorAll('#axis-labels text');
  tl.from(labelTexts, { opacity: 0, duration: 0.35, stagger: 0.07, ease: 'power2.out' }, 1.0);

  /* t=1.4–3.0: polygons grow from center */
  tl.to('#poly2019', { opacity: 1, duration: 0.12 }, 1.4);
  tl.fromTo('#poly2019', { svgOrigin: '0 0', scale: 0 }, { scale: 1, duration: 0.75, ease: 'power2.out' }, 1.4);
  tl.to('#dots2019', { opacity: 1, duration: 0.3 }, 1.9);

  tl.to('#poly2020', { opacity: 1, duration: 0.12 }, 1.75);
  tl.fromTo('#poly2020', { svgOrigin: '0 0', scale: 0 }, { scale: 1, duration: 0.75, ease: 'power2.out' }, 1.75);
  tl.to('#dots2020', { opacity: 1, duration: 0.3 }, 2.25);

  tl.to('#poly2021', { opacity: 1, duration: 0.12 }, 2.1);
  tl.fromTo('#poly2021', { svgOrigin: '0 0', scale: 0 }, { scale: 1, duration: 0.75, ease: 'power2.out' }, 2.1);
  tl.to('#dots2021', { opacity: 1, duration: 0.3 }, 2.6);

  tl.to('#poly2022', { opacity: 1, duration: 0.12 }, 2.45);
  tl.fromTo('#poly2022', { svgOrigin: '0 0', scale: 0 }, { scale: 1, duration: 0.75, ease: 'power2.out' }, 2.45);
  tl.to('#dots2022', { opacity: 1, duration: 0.3 }, 2.95);

  /* t=3.2: legend */
  tl.fromTo('#legend', { xPercent: -50, opacity: 0, y: 20 }, { xPercent: -50, opacity: 1, y: 0, duration: 0.55, ease: 'power2.out' }, 3.2);

  /* hold 3.8–7.0 */

  /* t=7.0: outro */
  tl.to('#legend', { xPercent: -50, opacity: 0, y: 20, duration: 0.4, ease: 'power2.in' }, 7.0);
  tl.to(['#dots2022','#poly2022'], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 7.1);
  tl.to(['#dots2021','#poly2021'], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 7.18);
  tl.to(['#dots2020','#poly2020'], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 7.26);
  tl.to(['#dots2019','#poly2019'], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 7.34);
  tl.to(['#axis-labels','#axis-lines','#grid-rings','#ring-labels','#center-dot'], { opacity: 0, duration: 0.4, ease: 'power2.in' }, 7.4);
  tl.to('#title-wrap', { xPercent: -50, opacity: 0, y: -24, duration: 0.45, ease: 'power2.in' }, 7.5);
  tl.to('#overlay', { opacity: 1, duration: 0.8, ease: 'power2.in' }, 7.5);
  tl.to('#bg', { opacity: 0, duration: 0.7, ease: 'power2.in' }, 7.7);

  /* register */
  window.__timelines = window.__timelines || {};
  window.__timelines['radar-chart'] = tl;
})();
</script>
</body>
</html>
