<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      :root { --k:#0C0C0C; --a:#C6FF00; --w:#F2F2EE; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#0C0C0C;
        font-family:'Bebas Neue',Impact,'Arial Black',sans-serif; }

      #stage { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

      /* ── Colour flood layers ───────────────────────────── */
      .flood { position:absolute; inset:0; clip-path:inset(0 100% 0 0); z-index:2; pointer-events:none; }
      #fl-acid  { background:#C6FF00; }
      #fl-white { background:#F2F2EE; }

      /* ── Grid texture ──────────────────────────────────── */
      #grid-tex {
        position:absolute; inset:0; z-index:1; opacity:0; pointer-events:none;
        background-image:
          linear-gradient(rgba(198,255,0,.07) 1px,transparent 1px),
          linear-gradient(90deg,rgba(198,255,0,.07) 1px,transparent 1px);
        background-size:120px 120px;
      }

      /* ── Scan line ─────────────────────────────────────── */
      #scan { position:absolute; left:0; width:100%; height:2px;
        background:#C6FF00; top:-4px; z-index:30; opacity:0; pointer-events:none; }

      /* ── S01 Logo ──────────────────────────────────────── */
      #s01 { position:absolute; inset:0; z-index:10; }
      #logo-row { position:absolute; top:50%; left:50%; transform:translate(-50%,-55%);
        display:flex; gap:0; }
      .ll { font-size:300px; font-weight:400; line-height:.9; color:#F2F2EE;
        opacity:0; display:block; }
      .ll.a { color:#C6FF00; }
      #s01-eye { position:absolute; bottom:110px; left:50%; transform:translateX(-50%);
        font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
        font-size:14px; letter-spacing:.55em; color:rgba(242,242,238,.45);
        text-transform:uppercase; opacity:0; white-space:nowrap; }

      /* ── S02 Colour System ─────────────────────────────── */
      #s02 { position:absolute; inset:0; z-index:9; pointer-events:none; }
      .clbl { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        font-size:220px; font-weight:400; line-height:.9; opacity:0; }
      #clbl-p { color:#0C0C0C; }
      #clbl-s { color:#C6FF00; }
      #clbl-ac { color:#F2F2EE; }
      #clbl-sy { color:#C6FF00; }
      #swatches { position:absolute; bottom:90px; left:50%; transform:translateX(-50%);
        display:flex; gap:18px; opacity:0; z-index:12; }
      .sw { width:88px; height:88px; }

      /* ── S03 Typography ────────────────────────────────── */
      #s03 { position:absolute; inset:0; z-index:10; pointer-events:none; }
      .tw { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        font-weight:400; line-height:.88; opacity:0; }
      #tw1 { font-size:420px; color:#F2F2EE; letter-spacing:-.01em; }
      #tw2 { font-size:200px; color:#C6FF00; letter-spacing:.18em; }
      #tw3 { font-size:340px; color:transparent; -webkit-text-stroke:2px #F2F2EE;
        letter-spacing:.06em; }
      #tw4 { font-size:160px; color:rgba(242,242,238,.28); letter-spacing:.7em; }
      #tw5 { font-size:500px; color:#C6FF00; letter-spacing:-.02em; }

      /* ── S04 Infographics ──────────────────────────────── */
      #s04 { position:absolute; inset:0; z-index:8; opacity:0; pointer-events:none; }

      /* ── S05 Grid ──────────────────────────────────────── */
      #s05 { position:absolute; top:50%; left:50%;
        transform:translate(-50%,-50%);
        display:grid; grid-template-columns:repeat(3,336px);
        grid-template-rows:repeat(3,198px); gap:10px;
        z-index:10; opacity:0; }
      .mc { opacity:0; overflow:hidden; }

      /* ── S06 App labels ────────────────────────────────── */
      .aplbl { position:absolute; top:50%; left:50%;
        transform:translate(-50%,-50%);
        font-size:380px; font-weight:400; line-height:.88; opacity:0; z-index:12; }
      #apl-rule { position:absolute; top:calc(50% + 230px); left:50%;
        transform:translateX(-50%); width:0; height:3px; background:#C6FF00;
        opacity:0; z-index:12; }

      /* ── S07 System blast ──────────────────────────────── */
      #s07 { position:absolute; inset:0; z-index:9; opacity:0; pointer-events:none; }

      /* ── S08 Final ─────────────────────────────────────── */
      #s08 { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        text-align:center; z-index:15; opacity:0; }
      #f-brand { font-size:240px; color:#F2F2EE; letter-spacing:.04em; line-height:.9; }
      #f-tag { font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
        font-size:17px; color:rgba(242,242,238,.42); letter-spacing:.65em;
        text-transform:uppercase; margin-top:28px; }
      #f-swrow { display:flex; gap:14px; justify-content:center; margin-top:36px; }
      .fsw { height:18px; }
    </style>
  </head>
  <body>
  <div id="root" data-composition-id="forma-reel"
       data-start="0" data-duration="60"
       data-width="1920" data-height="1080"
       style="overflow:hidden;">
  <div id="stage" data-layout-allow-overflow="true">

    <div id="grid-tex"></div>
    <div id="scan"></div>
    <div class="flood" id="fl-acid"></div>
    <div class="flood" id="fl-white"></div>

    <!-- ══ S01 LOGO REVEAL 0–3s ═══════════════════════════════════ -->
    <div id="s01" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
      <div id="logo-row">
        <span class="ll"   id="ll-f">F</span>
        <span class="ll a" id="ll-o">O</span>
        <span class="ll"   id="ll-r">R</span>
        <span class="ll a" id="ll-m">M</span>
        <span class="ll"   id="ll-a2">A</span>
      </div>
      <div id="s01-eye">BRAND IDENTITY SYSTEM — 2026</div>
    </div>

    <!-- ══ S02 COLOUR SYSTEM 3–8s ═════════════════════════════════ -->
    <div id="s02" class="clip" data-start="3" data-duration="5" data-track-index="2">
      <div class="clbl" id="clbl-p">PRIMARY</div>
      <div class="clbl" id="clbl-s">SECONDARY</div>
      <div class="clbl" id="clbl-ac">ACCENT</div>
      <div class="clbl" id="clbl-sy">SYSTEM</div>
    </div>
    <div id="swatches" class="clip" data-start="6.4" data-duration="1.6" data-track-index="3">
      <div class="sw" style="background:#0C0C0C;border:1px solid rgba(242,242,238,.18)"></div>
      <div class="sw" style="background:#C6FF00"></div>
      <div class="sw" style="background:#F2F2EE"></div>
    </div>

    <!-- ══ S03 TYPOGRAPHY 8–15s ════════════════════════════════════ -->
    <div id="s03" class="clip" data-start="8" data-duration="7" data-track-index="4">
      <div class="tw" id="tw1">THINK</div>
      <div class="tw" id="tw2">THINKING</div>
      <div class="tw" id="tw3">SYSTEM</div>
      <div class="tw" id="tw4">STRUCTURE</div>
      <div class="tw" id="tw5">DESIGN</div>
    </div>

    <!-- ══ S04 INFOGRAPHICS 15–22s ════════════════════════════════ -->
    <svg id="s04" class="clip" data-start="15" data-duration="7" data-track-index="5"
         viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <!-- axis lines -->
      <g id="s4-axes" opacity="0">
        <line x1="0" y1="540" x2="1920" y2="540" stroke="rgba(198,255,0,.12)" stroke-width="1"/>
        <line x1="960" y1="0"  x2="960"  y2="1080" stroke="rgba(198,255,0,.12)" stroke-width="1"/>
      </g>

      <!-- LINE CHART left -->
      <g id="s4-line" opacity="0">
        <line x1="120" y1="210" x2="120" y2="820" stroke="rgba(242,242,238,.25)" stroke-width="1.2"/>
        <line x1="120" y1="820" x2="780" y2="820" stroke="rgba(242,242,238,.25)" stroke-width="1.2"/>
        <line x1="120" y1="620" x2="780" y2="620" stroke="rgba(242,242,238,.07)" stroke-width="1" stroke-dasharray="6 8"/>
        <line x1="120" y1="420" x2="780" y2="420" stroke="rgba(242,242,238,.07)" stroke-width="1" stroke-dasharray="6 8"/>
        <path id="lp" d="M120,800 C200,775 280,720 380,640 C480,560 560,460 660,370 C710,325 745,285 778,250"
          fill="none" stroke="#C6FF00" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="1300" stroke-dashoffset="1300"/>
        <path d="M120,800 C200,775 280,720 380,640 C480,560 560,460 660,370 C710,325 745,285 778,250 L778,820 Z"
          fill="rgba(198,255,0,.05)" id="lp-fill" opacity="0"/>
        <circle id="dp1" cx="120" cy="800" r="6" fill="#C6FF00" opacity="0"/>
        <circle id="dp2" cx="380" cy="640" r="6" fill="#C6FF00" opacity="0"/>
        <circle id="dp3" cx="660" cy="370" r="6" fill="#C6FF00" opacity="0"/>
        <circle id="dp4" cx="778" cy="250" r="6" fill="#C6FF00" opacity="0"/>
        <text x="120" y="870" fill="rgba(242,242,238,.35)" font-family="'Space Grotesk',Arial,sans-serif" font-size="16" letter-spacing=".28em">GROWTH INDEX</text>
      </g>

      <!-- BAR CHART center -->
      <g id="s4-bar" opacity="0">
        <line x1="880" y1="820" x2="1120" y2="820" stroke="rgba(242,242,238,.25)" stroke-width="1.2"/>
        <rect id="ba1" x="900"  y="820" width="44" height="0" fill="#C6FF00"/>
        <rect id="ba2" x="958"  y="820" width="44" height="0" fill="rgba(242,242,238,.9)"/>
        <rect id="ba3" x="1016" y="820" width="44" height="0" fill="rgba(198,255,0,.55)"/>
        <rect id="ba4" x="1074" y="820" width="44" height="0" fill="rgba(242,242,238,.55)"/>
        <text x="1000" y="870" fill="rgba(242,242,238,.35)" font-family="'Space Grotesk',Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing=".28em">EFFICIENCY</text>
      </g>

      <!-- RING right -->
      <g id="s4-ring" opacity="0">
        <circle cx="1500" cy="515" r="230" fill="none" stroke="rgba(242,242,238,.1)" stroke-width="28"/>
        <circle id="rp" cx="1500" cy="515" r="230" fill="none" stroke="#C6FF00" stroke-width="28"
          stroke-dasharray="1445" stroke-dashoffset="1445" stroke-linecap="round"
          transform="rotate(-90 1500 515)"/>
        <text x="1500" y="492" fill="#F2F2EE" font-family="'Bebas Neue',Impact,sans-serif" font-size="88" text-anchor="middle">87</text>
        <text x="1500" y="544" fill="rgba(242,242,238,.4)" font-family="'Space Grotesk',Arial,sans-serif" font-size="18" text-anchor="middle" letter-spacing=".35em">SCORE</text>
      </g>

      <!-- NODE NETWORK bottom -->
      <g id="s4-nodes" opacity="0">
        <line id="nl1" x1="400" y1="940" x2="600" y2="910" stroke="rgba(198,255,0,.4)" stroke-width="1.5" stroke-dasharray="220" stroke-dashoffset="220"/>
        <line id="nl2" x1="600" y1="910" x2="800" y2="940" stroke="rgba(198,255,0,.4)" stroke-width="1.5" stroke-dasharray="220" stroke-dashoffset="220"/>
        <line id="nl3" x1="600" y1="910" x2="540" y2="990" stroke="rgba(198,255,0,.28)" stroke-width="1.2" stroke-dasharray="110" stroke-dashoffset="110"/>
        <line id="nl4" x1="600" y1="910" x2="670" y2="985" stroke="rgba(198,255,0,.28)" stroke-width="1.2" stroke-dasharray="110" stroke-dashoffset="110"/>
        <circle cx="400" cy="940" r="7" fill="#C6FF00" id="nd1" opacity="0"/>
        <circle cx="600" cy="910" r="9" fill="#C6FF00" id="nd2" opacity="0"/>
        <circle cx="800" cy="940" r="7" fill="#C6FF00" id="nd3" opacity="0"/>
        <circle cx="540" cy="990" r="5" fill="rgba(198,255,0,.6)" id="nd4" opacity="0"/>
        <circle cx="670" cy="985" r="5" fill="rgba(198,255,0,.6)" id="nd5" opacity="0"/>
      </g>

      <!-- Count label -->
      <text id="s4-count" x="1500" y="150" fill="rgba(198,255,0,.65)" font-family="'Bebas Neue',Impact,sans-serif" font-size="130" text-anchor="middle" opacity="0">2.4M</text>
      <text x="1500" y="188" fill="rgba(242,242,238,.3)" font-family="'Space Grotesk',Arial,sans-serif" font-size="15" text-anchor="middle" letter-spacing=".35em" id="s4-unit" opacity="0">ACTIVE USERS</text>
    </svg>

    <!-- ══ S05 PRODUCT GRID 22–30s ════════════════════════════════ -->
    <div id="s05" class="clip" data-start="22" data-duration="8" data-track-index="6" data-layout-allow-overflow="true">
      <!-- card 1: APP UI -->
      <div class="mc" id="mc1">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#141414"/>
          <rect x="16" y="16" width="180" height="12" rx="2" fill="#C6FF00" opacity=".85"/>
          <rect x="16" y="36" width="110" height="8"  rx="2" fill="rgba(242,242,238,.18)"/>
          <rect x="16" y="58" width="304" height="88" rx="3" fill="rgba(198,255,0,.08)" stroke="rgba(198,255,0,.25)" stroke-width="1"/>
          <text x="26" y="110" fill="#C6FF00" font-family="'Bebas Neue',Impact,sans-serif" font-size="36">APP UI</text>
          <rect x="16" y="160" width="88" height="10" rx="2" fill="rgba(198,255,0,.4)"/>
          <rect x="112" y="160" width="64" height="10" rx="2" fill="rgba(242,242,238,.14)"/>
        </svg>
      </div>
      <!-- card 2: POSTER -->
      <div class="mc" id="mc2">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#C6FF00"/>
          <text x="22" y="106" fill="#0C0C0C" font-family="'Bebas Neue',Impact,sans-serif" font-size="72">FORMA</text>
          <rect x="22" y="116" width="180" height="3" fill="#0C0C0C"/>
          <text x="22" y="148" fill="rgba(12,12,12,.55)" font-family="'Space Grotesk',Arial,sans-serif" font-size="11" letter-spacing=".3em">DESIGN SYSTEM · 2026</text>
        </svg>
      </div>
      <!-- card 3: WEB -->
      <div class="mc" id="mc3">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#111"/>
          <rect x="0" y="0" width="336" height="28" fill="#1C1C1C"/>
          <circle cx="16" cy="14" r="5" fill="#FF5F57"/><circle cx="32" cy="14" r="5" fill="#FEBC2E"/><circle cx="48" cy="14" r="5" fill="#28C840"/>
          <rect x="80" y="8" width="176" height="12" rx="6" fill="rgba(255,255,255,.06)"/>
          <rect x="16" y="46" width="304" height="44" rx="2" fill="rgba(198,255,0,.07)" stroke="rgba(198,255,0,.22)" stroke-width=".8"/>
          <text x="26" y="74" fill="#C6FF00" font-family="'Bebas Neue',Impact,sans-serif" font-size="26">WEBSITE SYSTEM</text>
          <rect x="16" y="104" width="140" height="8" rx="2" fill="rgba(242,242,238,.15)"/>
          <rect x="16" y="118" width="100" height="8" rx="2" fill="rgba(242,242,238,.09)"/>
          <rect x="16" y="140" width="64" height="24" rx="2" fill="#C6FF00"/>
          <text x="26" y="157" fill="#0C0C0C" font-family="'Space Grotesk',Arial,sans-serif" font-size="11" font-weight="700">EXPLORE</text>
        </svg>
      </div>
      <!-- card 4: PACKAGING -->
      <div class="mc" id="mc4">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#0C0C0C"/>
          <rect x="98" y="28" width="140" height="142" fill="#1A1A1A" stroke="rgba(198,255,0,.35)" stroke-width="1"/>
          <rect x="98" y="28" width="140" height="32" fill="#C6FF00"/>
          <text x="168" y="51" fill="#0C0C0C" font-family="'Bebas Neue',Impact,sans-serif" font-size="20" text-anchor="middle">FORMA</text>
          <text x="168" y="112" fill="#F2F2EE" font-family="'Space Grotesk',Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing=".22em">PACKAGING</text>
          <line x1="98" y1="84" x2="238" y2="84" stroke="rgba(198,255,0,.18)" stroke-width=".8"/>
        </svg>
      </div>
      <!-- card 5: SOCIAL -->
      <div class="mc" id="mc5">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#C6FF00"/>
          <text x="168" y="108" fill="#0C0C0C" font-family="'Bebas Neue',Impact,sans-serif" font-size="96" text-anchor="middle">F</text>
          <text x="168" y="140" fill="rgba(12,12,12,.55)" font-family="'Space Grotesk',Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing=".42em">SOCIAL MEDIA</text>
          <rect x="68" y="154" width="200" height="1" fill="rgba(12,12,12,.18)"/>
          <text x="168" y="174" fill="rgba(12,12,12,.4)" font-family="'Space Grotesk',Arial,sans-serif" font-size="9" text-anchor="middle" letter-spacing=".3em">@FORMA.SYSTEM</text>
        </svg>
      </div>
      <!-- card 6: CARD -->
      <div class="mc" id="mc6">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#1A1A1A"/>
          <rect x="68" y="54" width="200" height="90" fill="#0C0C0C" rx="4" stroke="rgba(198,255,0,.28)" stroke-width=".8"/>
          <text x="88" y="100" fill="#F2F2EE" font-family="'Bebas Neue',Impact,sans-serif" font-size="34">FORMA</text>
          <text x="88" y="122" fill="rgba(198,255,0,.65)" font-family="'Space Grotesk',Arial,sans-serif" font-size="9" letter-spacing=".22em">DESIGN DIRECTOR</text>
          <text x="220" y="136" fill="rgba(242,242,238,.25)" font-family="'Space Grotesk',Arial,sans-serif" font-size="8" letter-spacing=".15em">CARD</text>
        </svg>
      </div>
      <!-- card 7: MERCH -->
      <div class="mc" id="mc7">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#F2F2EE"/>
          <path d="M108,44 L64,72 L94,84 L94,162 L242,162 L242,84 L272,72 L228,44 L198,58 C184,70 152,70 138,58 Z" fill="#0C0C0C" stroke-width="1.5"/>
          <text x="168" y="124" fill="#C6FF00" font-family="'Bebas Neue',Impact,sans-serif" font-size="26" text-anchor="middle">FORMA</text>
          <text x="264" y="186" fill="rgba(12,12,12,.28)" font-family="'Space Grotesk',Arial,sans-serif" font-size="9" letter-spacing=".2em">MERCH</text>
        </svg>
      </div>
      <!-- card 8: OOH -->
      <div class="mc" id="mc8">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#0C0C0C"/>
          <rect x="20" y="18" width="296" height="120" fill="#C6FF00"/>
          <text x="168" y="94" fill="#0C0C0C" font-family="'Bebas Neue',Impact,sans-serif" font-size="62" text-anchor="middle">FORMA</text>
          <rect x="104" y="138" width="7" height="46" fill="rgba(242,242,238,.2)"/>
          <rect x="225" y="138" width="7" height="46" fill="rgba(242,242,238,.2)"/>
          <text x="168" y="192" fill="rgba(198,255,0,.4)" font-family="'Space Grotesk',Arial,sans-serif" font-size="9" text-anchor="middle" letter-spacing=".3em">OOH ADVERTISING</text>
        </svg>
      </div>
      <!-- card 9: MOTION -->
      <div class="mc" id="mc9">
        <svg width="336" height="198" viewBox="0 0 336 198"><rect width="336" height="198" fill="#141414"/>
          <circle cx="168" cy="99" r="68" fill="none" stroke="rgba(198,255,0,.3)" stroke-width="1.2"/>
          <circle cx="168" cy="99" r="48" fill="none" stroke="rgba(198,255,0,.18)" stroke-width=".8"/>
          <circle cx="168" cy="99" r="28" fill="none" stroke="#C6FF00" stroke-width="1.5"/>
          <circle cx="168" cy="99" r="5"  fill="#C6FF00"/>
          <text x="168" y="182" fill="rgba(198,255,0,.45)" font-family="'Space Grotesk',Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing=".3em">MOTION</text>
        </svg>
      </div>
    </div>

    <!-- ══ S06 APPLICATION 30–40s ══════════════════════════════════ -->
    <div class="aplbl clip" id="apl-1" data-start="30"   data-duration="1.8" data-track-index="7" style="color:#F2F2EE;">POSTER</div>
    <div class="aplbl clip" id="apl-2" data-start="31.8" data-duration="1.6" data-track-index="7" style="color:#0C0C0C;">SOCIAL</div>
    <div class="aplbl clip" id="apl-3" data-start="33.4" data-duration="1.6" data-track-index="7" style="color:#F2F2EE;">PACK</div>
    <div class="aplbl clip" id="apl-4" data-start="35"   data-duration="1.6" data-track-index="7" style="color:#0C0C0C;">APP</div>
    <div class="aplbl clip" id="apl-5" data-start="36.6" data-duration="1.6" data-track-index="7" style="color:#F2F2EE;">WEB</div>
    <div class="aplbl clip" id="apl-6" data-start="38.2" data-duration="1.8" data-track-index="7" style="color:#0C0C0C;">OOH</div>
    <div id="apl-rule" class="clip" data-start="30" data-duration="10" data-track-index="8"></div>

    <!-- ══ S07 SYSTEM BLAST 40–50s ════════════════════════════════ -->
    <svg id="s07" class="clip" data-start="40" data-duration="10" data-track-index="9" data-layout-allow-overflow="true"
         viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <text id="s7-bg" x="960" y="640" fill="rgba(242,242,238,.05)"
        font-family="'Bebas Neue',Impact,sans-serif" font-size="680" text-anchor="middle" opacity="0">F</text>
      <g id="s7-grid" opacity="0">
        <line x1="0"    y1="360" x2="1920" y2="360"  stroke="rgba(198,255,0,.18)" stroke-width="1"/>
        <line x1="0"    y1="720" x2="1920" y2="720"  stroke="rgba(198,255,0,.18)" stroke-width="1"/>
        <line x1="640"  y1="0"   x2="640"  y2="1080" stroke="rgba(198,255,0,.18)" stroke-width="1"/>
        <line x1="1280" y1="0"   x2="1280" y2="1080" stroke="rgba(198,255,0,.18)" stroke-width="1"/>
      </g>
      <g id="s7-els" opacity="0">
        <!-- mini line chart TL -->
        <path id="s7-lp" d="M80,320 L200,270 L360,200 L520,140"
          fill="none" stroke="#C6FF00" stroke-width="2.5"
          stroke-dasharray="520" stroke-dashoffset="520"/>
        <!-- mini bars TR -->
        <rect id="s7-b1" x="1480" y="320" width="32" height="0" fill="rgba(198,255,0,.65)"/>
        <rect id="s7-b2" x="1526" y="320" width="32" height="0" fill="rgba(198,255,0,.45)"/>
        <rect id="s7-b3" x="1572" y="320" width="32" height="0" fill="rgba(198,255,0,.55)"/>
        <!-- ring BL -->
        <circle cx="220" cy="820" r="90" fill="none" stroke="rgba(198,255,0,.22)" stroke-width="16"/>
        <circle id="s7-rp" cx="220" cy="820" r="90" fill="none" stroke="#C6FF00" stroke-width="16"
          stroke-dasharray="565" stroke-dashoffset="565" stroke-linecap="round"
          transform="rotate(-90 220 820)"/>
        <!-- text fragments -->
        <text x="720" y="190" fill="rgba(242,242,238,.28)" font-family="'Bebas Neue',Impact,sans-serif" font-size="44" letter-spacing=".55em">BRAND SYSTEM 2026</text>
        <text x="80"  y="980" fill="rgba(198,255,0,.45)" font-family="'Bebas Neue',Impact,sans-serif" font-size="64">IDENTITY</text>
        <text x="1440" y="980" fill="rgba(242,242,238,.38)" font-family="'Bebas Neue',Impact,sans-serif" font-size="64">MOTION</text>
      </g>
      <!-- cross-hair center -->
      <line id="s7-ch" x1="860" y1="540" x2="1060" y2="540" stroke="#C6FF00" stroke-width="1.2" opacity="0"/>
      <line id="s7-cv" x1="960" y1="440" x2="960"  y2="640" stroke="#C6FF00" stroke-width="1.2" opacity="0"/>
    </svg>

    <!-- ══ S08 FINAL LOCKUP 50–60s ════════════════════════════════ -->
    <div id="s08" class="clip" data-start="50" data-duration="10" data-track-index="10">
      <div id="f-brand">FORMA</div>
      <div id="f-tag">SYSTEM · IDENTITY · MOTION</div>
      <div id="f-swrow">
        <div class="fsw" style="width:80px;background:#0C0C0C;border:1px solid rgba(242,242,238,.2)"></div>
        <div class="fsw" style="width:80px;background:#C6FF00"></div>
        <div class="fsw" style="width:80px;background:#F2F2EE"></div>
      </div>
    </div>

  </div><!-- #stage -->
  </div><!-- #root -->

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.set("#apl-rule", { opacity:0, width:0 }, 0);

    // helper: scan line drop
    function scanDrop(t, dur) {
      tl.set("#scan", { y: 0, opacity: 1 }, t);
      tl.to("#scan",  { y: 1084, opacity: 1, duration: dur, ease:"power1.in" }, t);
      tl.set("#scan", { opacity: 0 }, t + dur + .01);
    }

    // ── S01  LOGO REVEAL  0–3s ────────────────────────────────────
    tl.to("#grid-tex", { opacity:1, duration:.1 }, 0);
    tl.to("#grid-tex", { opacity:0, duration:.5 }, .4);

    tl.fromTo("#ll-f",  {opacity:0,scale:9,y:-260},{opacity:1,scale:1,y:0,duration:.2,ease:"power4.out"}, .08);
    tl.fromTo("#ll-o",  {opacity:0,scale:9,y: 260},{opacity:1,scale:1,y:0,duration:.2,ease:"power4.out"}, .18);
    tl.fromTo("#ll-r",  {opacity:0,scale:9,x:-360},{opacity:1,scale:1,x:0,duration:.2,ease:"power4.out"}, .28);
    tl.fromTo("#ll-m",  {opacity:0,scale:9,x: 360},{opacity:1,scale:1,x:0,duration:.2,ease:"power4.out"}, .38);
    tl.fromTo("#ll-a2", {opacity:0,scale:9,y:-260},{opacity:1,scale:1,y:0,duration:.2,ease:"power4.out"}, .48);

    tl.to("#s01-eye", { opacity:1, duration:.4, ease:"power2.out" }, 1.5);

    // brief grid snap at 2.2s
    tl.to("#grid-tex", { opacity:.45, duration:.06 }, 2.2);
    tl.to("#grid-tex", { opacity:0,   duration:.35 }, 2.28);

    // burst out
    tl.to("#ll-f",  {x:-580,opacity:0,duration:.22,ease:"power3.in"}, 2.72);
    tl.to("#ll-o",  {y:-420,opacity:0,duration:.22,ease:"power3.in"}, 2.74);
    tl.to("#ll-r",  {x: 220,y:320,opacity:0,duration:.22,ease:"power3.in"}, 2.76);
    tl.to("#ll-m",  {x:-220,y:320,opacity:0,duration:.22,ease:"power3.in"}, 2.78);
    tl.to("#ll-a2", {x: 580,opacity:0,duration:.22,ease:"power3.in"}, 2.80);
    tl.to("#s01-eye",{ opacity:0, duration:.18 }, 2.82);
    tl.set("#ll-f",   { opacity:0 }, 3.0);
    tl.set("#ll-o",   { opacity:0 }, 3.0);
    tl.set("#ll-r",   { opacity:0 }, 3.0);
    tl.set("#ll-m",   { opacity:0 }, 3.0);
    tl.set("#ll-a2",  { opacity:0 }, 3.0);
    tl.set("#s01-eye",{ opacity:0 }, 3.0);

    // ── S02  COLOUR SYSTEM  3–8s ──────────────────────────────────
    // acid PRIMARY
    tl.fromTo("#fl-acid",{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)",duration:.18,ease:"power4.out"}, 3.0);
    tl.fromTo("#clbl-p", {opacity:0,scale:1.5},{opacity:1,scale:1,duration:.18,ease:"power3.out"}, 3.08);
    tl.to("#fl-acid",  {clipPath:"inset(0 0 0 100%)",duration:.18,ease:"power4.in"}, 3.85);
    tl.to("#clbl-p",   {opacity:0,duration:.14}, 3.85);

    // white SECONDARY
    tl.fromTo("#fl-white",{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)",duration:.18,ease:"power4.out"}, 4.1);
    tl.fromTo("#clbl-s", {opacity:0,scale:1.5},{opacity:1,scale:1,duration:.18,ease:"power3.out"}, 4.18);
    tl.to("#fl-white", {clipPath:"inset(0 0 0 100%)",duration:.18,ease:"power4.in"}, 4.95);
    tl.to("#clbl-s",   {opacity:0,duration:.14}, 4.95);

    // acid ACCENT  (dark text on acid)
    tl.fromTo("#fl-acid",{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)",duration:.18,ease:"power4.out"}, 5.25);
    tl.fromTo("#clbl-ac",{opacity:0,scale:1.5},{opacity:1,scale:1,duration:.18,ease:"power3.out"}, 5.33);
    tl.to("#fl-acid",  {clipPath:"inset(0 0 0 100%)",duration:.18,ease:"power4.in"}, 6.05);
    tl.to("#clbl-ac",  {opacity:0,duration:.14}, 6.05);

    // SYSTEM + swatches
    tl.fromTo("#clbl-sy",{opacity:0,y:70},{opacity:1,y:0,duration:.25,ease:"back.out(2)"}, 6.35);
    tl.to("#swatches",   {opacity:1,duration:.3}, 6.55);
    tl.to("#clbl-sy",    {opacity:0,duration:.2}, 7.7);
    tl.to("#swatches",   {opacity:0,duration:.2}, 7.8);

    scanDrop(7.9, .5);

    // ── S03  TYPOGRAPHY  8–15s ────────────────────────────────────
    scanDrop(8.0, .75);

    // THINK — compresses then expands
    tl.fromTo("#tw1",{opacity:0,scale:1.55},{opacity:1,scale:1,duration:.2,ease:"power4.out",overwrite:"auto"}, 8.05);
    tl.to("#tw1",{letterSpacing:".55em",duration:.82,ease:"power2.out"}, 8.26);
    tl.to("#tw1",{opacity:0,scale:.82,duration:.2,ease:"power3.in"}, 9.1);

    // THINKING
    tl.fromTo("#tw2",{opacity:0,letterSpacing:"-.08em"},{opacity:1,letterSpacing:".18em",duration:.28,ease:"power3.out"}, 9.22);
    tl.to("#tw2",{opacity:0,y:-90,duration:.22,ease:"power3.in"}, 10.65);

    scanDrop(10.72, .55);

    // SYSTEM — stroke outline
    tl.fromTo("#tw3",{opacity:0,scale:.55},{opacity:1,scale:1,duration:.22,ease:"back.out(1.4)"}, 10.8);
    tl.to("#tw3",{letterSpacing:".28em",duration:.95}, 11.0);
    tl.to("#tw3",{opacity:0,duration:.2}, 12.05);

    // STRUCTURE — ghost tracking
    tl.fromTo("#tw4",{opacity:0,letterSpacing:".25em"},{opacity:1,letterSpacing:".7em",duration:1.1,ease:"power1.out"}, 12.1);
    tl.to("#tw4",{opacity:0,duration:.25}, 13.45);

    // DESIGN — giant acid slam
    tl.fromTo("#tw5",{opacity:0,y:220},{opacity:1,y:0,duration:.26,ease:"power4.out"}, 13.55);
    tl.to("#tw5",{opacity:0,scale:1.35,duration:.3,ease:"power3.in"}, 14.72);

    scanDrop(14.75, .5);

    // ── S04  INFOGRAPHICS  15–22s ─────────────────────────────────
    tl.to("#s04", {opacity:1,duration:.1}, 15.0);
    tl.to("#s4-axes",{opacity:1,duration:.25}, 15.1);

    // line chart
    tl.to("#s4-line",{opacity:1,duration:.15}, 15.25);
    tl.to("#lp",{strokeDashoffset:0,duration:1.3,ease:"power2.inOut"}, 15.35);
    tl.to("#lp-fill",{opacity:1,duration:.6}, 15.8);
    ["#dp1","#dp2","#dp3","#dp4"].forEach((d,i)=>
      tl.to(d,{opacity:1,duration:.15}, 15.55+i*.3));

    // bars
    tl.to("#s4-bar",{opacity:1,duration:.15}, 16.4);
    tl.to("#ba1",{attr:{y:540,height:280},duration:.38,ease:"power3.out"}, 16.5);
    tl.to("#ba2",{attr:{y:620,height:200},duration:.38,ease:"power3.out"}, 16.6);
    tl.to("#ba3",{attr:{y:580,height:240},duration:.38,ease:"power3.out"}, 16.7);
    tl.to("#ba4",{attr:{y:640,height:180},duration:.38,ease:"power3.out"}, 16.8);

    // ring
    tl.to("#s4-ring",{opacity:1,duration:.15}, 17.5);
    tl.to("#rp",{strokeDashoffset: 1445*.13, duration:1.3,ease:"power2.inOut"}, 17.6);
    tl.to("#s4-count",{opacity:1,duration:.3}, 18.3);
    tl.to("#s4-unit",{opacity:1,duration:.3}, 18.5);

    // nodes
    tl.to("#s4-nodes",{opacity:1,duration:.2}, 19.0);
    ["#nd1","#nd2","#nd3","#nd4","#nd5"].forEach((d,i)=>
      tl.to(d,{opacity:1,duration:.15}, 19.1+i*.1));
    ["#nl1","#nl2","#nl3","#nl4"].forEach((d,i)=>
      tl.to(d,{strokeDashoffset:0,duration:.5,ease:"power2.out"}, 19.15+i*.08));

    tl.to("#s04",{opacity:0,scale:1.06,duration:.45,ease:"power2.in"}, 21.5);

    // ── S05  PRODUCT GRID  22–30s ─────────────────────────────────
    tl.to("#s05",{opacity:1,duration:.1}, 22.0);
    ["mc1","mc2","mc3","mc4","mc5","mc6","mc7","mc8","mc9"].forEach((id,i)=>{
      tl.fromTo(`#${id}`,{opacity:0,scale:.82,y:28},{opacity:1,scale:1,y:0,duration:.3,ease:"back.out(1.4)"}, 22.1+i*.18);
    });

    scanDrop(24.6, 1.1);

    // pulse cascade
    ["mc1","mc2","mc3","mc4","mc5","mc6","mc7","mc8","mc9"].forEach((id,i)=>{
      tl.to(`#${id}`,{scale:1.05,duration:.2,ease:"power1.inOut",yoyo:true,repeat:1}, 26.6+i*.08);
    });

    tl.to("#s05",{scale:.88,opacity:0,duration:.35,ease:"power3.in"}, 29.6);

    // ── S06  APPLICATION  30–40s ──────────────────────────────────
    const aplData = [
      {id:"apl-1", fl:"#fl-acid",  flt:30.0},
      {id:"apl-2", fl:"#fl-white", flt:31.8},
      {id:"apl-3", fl:"#fl-acid",  flt:33.4},
      {id:"apl-4", fl:"#fl-white", flt:35.0},
      {id:"apl-5", fl:"#fl-acid",  flt:36.6},
      {id:"apl-6", fl:"#fl-white", flt:38.2},
    ];
    aplData.forEach(({id, fl, flt}) => {
      const t = flt;
      tl.fromTo(fl,{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)",duration:.1,ease:"none"}, t);
      tl.fromTo(`#${id}`,{opacity:0,scale:1.7,rotation:fl==="#fl-acid"?-4:4},
        {opacity:1,scale:1,rotation:0,duration:.2,ease:"power4.out"}, t+.04);
      tl.to("#apl-rule",{opacity:1,width:840,duration:.28,ease:"power2.out"}, t+.05);
      tl.to(fl,{clipPath:"inset(0 0 0 100%)",duration:.1,ease:"none"}, t+.22);
      tl.to(`#${id}`,{opacity:0,duration:.18,ease:"power3.in"}, t+1.55);
      tl.to("#apl-rule",{width:0,opacity:0,duration:.18}, t+1.5);
    });

    scanDrop(39.5, .4);

    // ── S07  SYSTEM BLAST  40–50s ─────────────────────────────────
    tl.to("#s07",{opacity:1,duration:.1}, 40.0);
    tl.to("#s7-bg",{opacity:1,duration:.4}, 40.1);
    tl.to("#s7-grid",{opacity:1,duration:.25}, 40.25);
    tl.to("#s7-ch",{opacity:1,duration:.2}, 40.5);
    tl.to("#s7-cv",{opacity:1,duration:.2}, 40.5);

    tl.to("#s7-els",{opacity:1,duration:.3}, 40.8);
    tl.to("#s7-lp",{strokeDashoffset:0,duration:1.6,ease:"power2.inOut"}, 40.9);
    tl.to("#s7-rp",{strokeDashoffset:0,duration:1.3,ease:"power2.inOut"}, 41.1);
    tl.to("#s7-b1",{attr:{y:120,height:200},duration:.4,ease:"power3.out"}, 41.2);
    tl.to("#s7-b2",{attr:{y:180,height:140},duration:.4,ease:"power3.out"}, 41.35);
    tl.to("#s7-b3",{attr:{y:140,height:180},duration:.4,ease:"power3.out"}, 41.5);

    // rapid colour flashes
    [[43.0,"#fl-acid"],[43.5,"#fl-white"],[44.2,"#fl-acid"]].forEach(([t,fl])=>{
      tl.fromTo(fl,{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)",duration:.1,ease:"none"}, t);
      tl.to(fl,{clipPath:"inset(0 0 0 100%)",duration:.1,ease:"none"}, t+.2);
    });

    // bg letter pulses
    tl.to("#s7-bg",{scale:1.12,transformOrigin:"center",duration:1.8,ease:"sine.inOut",yoyo:true,repeat:3}, 43.0);
    tl.to("#s7-grid",{opacity:.4,duration:.9,ease:"sine.inOut",yoyo:true,repeat:4}, 43.2);

    scanDrop(44.9,.38);
    scanDrop(46.1,.38);

    tl.to("#s07",{opacity:0,scale:.95,duration:.4,ease:"power2.in"}, 49.55);

    // ── S08  FINAL LOCKUP  50–60s ─────────────────────────────────
    // acid flash
    tl.fromTo("#fl-acid",{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)",duration:.18,ease:"power4.out"}, 50.0);
    tl.to("#fl-acid",{clipPath:"inset(0 0 0 100%)",duration:.18,ease:"power4.in"}, 50.3);

    tl.fromTo("#s08",{opacity:0},{opacity:1,duration:.1}, 50.28);
    tl.fromTo("#f-brand",{opacity:0,scale:1.35,y:70},{opacity:1,scale:1,y:0,duration:.42,ease:"power4.out"}, 50.35);
    tl.fromTo("#f-tag",{opacity:0,letterSpacing:".2em"},{opacity:1,letterSpacing:".65em",duration:.65,ease:"power2.out"}, 50.85);
    tl.fromTo(".fsw",{scaleX:0},{scaleX:1,duration:.3,stagger:.12,ease:"power3.out",transformOrigin:"left center"}, 51.6);

    tl.to("#grid-tex",{opacity:.18,duration:1.6}, 52.0);

    // subtle pulse
    tl.to("#f-brand",{scale:1.025,transformOrigin:"center",duration:2.2,ease:"sine.inOut",yoyo:true,repeat:3}, 52.8);

    scanDrop(55.5,.75);

    // final acid underline
    tl.fromTo("#fl-acid",{clipPath:"inset(98% 0 0 0)"},{clipPath:"inset(94% 0 0 0)",duration:.4,ease:"power2.out"}, 56.2);
    tl.to("#fl-acid",{clipPath:"inset(98% 0 0 0)",duration:.4,ease:"power2.in"}, 57.5);

    window.__timelines["forma-reel"] = tl;
  </script>
  </body>
</html>
