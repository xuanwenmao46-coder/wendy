<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: 'Barlow Condensed';
        font-style: normal;
        font-weight: 900;
        src: url('./assets/fonts/barlow-condensed-900.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Barlow Condensed';
        font-style: italic;
        font-weight: 900;
        src: url('./assets/fonts/barlow-condensed-900-italic.ttf') format('truetype');
      }
    </style>
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }

      /* ── Cream scene ── */
      #bgCream {
        position: absolute;
        inset: 0;
        background: #e7e2da;
        opacity: 0;
      }

      /* ── Word stack ── */
      .word-block {
        position: absolute;
        left: 115px;
        top: 138px;
      }

      .word {
        display: block;
        font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 192px;
        line-height: 0.955;
        letter-spacing: -2px;
        color: #231f20;
        opacity: 0;
        will-change: transform, opacity, filter;
      }

      .word-italic { font-style: italic; }

      /* ── Coral scene ── */
      #bgCoral {
        position: absolute;
        inset: 0;
        background: #d4706b;
        transform: scaleY(0);
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* ── Coral words ── */
      .coral-block {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 0.92;
      }

      .coral-word {
        display: block;
        font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 258px;
        color: #f0ece5;
        letter-spacing: -1px;
        opacity: 0;
        will-change: transform, opacity;
      }

      /* ── Outro fade overlay ── */
      #fadeOut {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9"
      data-width="1920"
      data-height="1080"
    >
      <!-- ── Background cream ── -->
      <div id="bgCream"></div>

      <!-- ── Scene 1: word stack ── -->
      <div class="word-block" data-layout-allow-overflow="true">
        <span class="word"             id="w1" data-layout-allow-overflow="true">KINETIC</span>
        <span class="word"             id="w2" data-layout-allow-overflow="true">TYPOGRAPHY</span>
        <span class="word word-italic" id="w3" data-layout-allow-overflow="true">PROMO</span>
        <span class="word"             id="w4" data-layout-allow-overflow="true">SLIDESHOW</span>
      </div>

      <!-- ── Coral wipe bg ── -->
      <div id="bgCoral"></div>

      <!-- ── Scene 2: coral words ── -->
      <div class="coral-block" data-layout-allow-overflow="true">
        <span class="coral-word" id="cw1" data-layout-allow-overflow="true">UNIVERSAL</span>
        <span class="coral-word" id="cw2" data-layout-allow-overflow="true">EXPRSSIONS</span>
      </div>

      <!-- ── End fade ── -->
      <div id="fadeOut"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ════════════════════════════════════════
         PHASE 0 — Fade in (0 → 0.4s)
      ════════════════════════════════════════ */
      tl.to('#bgCream', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0);

      /* ════════════════════════════════════════
         PHASE 1 — Words enter from bottom (0.3 → 2.3s)
         Each word slides up from y+260 with power3.out
      ════════════════════════════════════════ */
      var entries = [
        { id: '#w1', t: 0.30 },
        { id: '#w2', t: 0.72 },
        { id: '#w3', t: 1.10 },
        { id: '#w4', t: 1.50 }
      ];

      entries.forEach(function (e) {
        tl.fromTo(e.id,
          { opacity: 0, y: 270 },
          { opacity: 1, y: 0, duration: 0.46, ease: 'power3.out' },
          e.t
        );
      });

      /* ════════════════════════════════════════
         PHASE 2 — Hold (implicit 2.3 → 2.8s)
      ════════════════════════════════════════ */

      /* ════════════════════════════════════════
         PHASE 3 — Scatter + letter zoom (2.8 → 3.55s)
         Words fly in 4 directions while scaling up.
         PROMO scales to 14× so its M letter fills the frame.
      ════════════════════════════════════════ */
      var ST = 2.82;

      /* KINETIC → top-right */
      tl.to('#w1', {
        x: 820, y: -560, scale: 6,
        opacity: 0, filter: 'blur(5px)',
        duration: 0.58, ease: 'power3.in'
      }, ST);

      /* TYPOGRAPHY → hard left */
      tl.to('#w2', {
        x: -1350, y: 60, scale: 4.5,
        opacity: 0, filter: 'blur(10px)',
        duration: 0.60, ease: 'power3.in'
      }, ST + 0.04);

      /* PROMO → scale up massively, shift left so M fills screen center */
      tl.to('#w3', {
        x: -480, y: 160, scale: 14,
        opacity: 1, filter: 'blur(0px)',
        duration: 0.55, ease: 'power2.in'
      }, ST + 0.02);
      /* then fade quickly before wipe */
      tl.to('#w3', { opacity: 0, duration: 0.18, ease: 'power1.in', overwrite: true }, ST + 0.57);

      /* SLIDESHOW → left + up */
      tl.to('#w4', {
        x: -720, y: -350, scale: 5,
        opacity: 0, filter: 'blur(8px)',
        duration: 0.58, ease: 'power3.in'
      }, ST + 0.06);

      /* ════════════════════════════════════════
         PHASE 4 — Coral horizontal wipe (3.5 → 4.0s)
         scaleY from 0 → 1 (expand from vertical center)
      ════════════════════════════════════════ */
      tl.to('#bgCoral', {
        scaleY: 1, duration: 0.48, ease: 'power2.inOut'
      }, 3.50);

      /* Cream bg dims behind the wipe */
      tl.to('#bgCream', { opacity: 0, duration: 0.25 }, 3.72);

      /* ════════════════════════════════════════
         PHASE 5 — Coral words slide in (4.1 → 5.2s)
         UNIVERSAL from right, EXPRSSIONS from left
      ════════════════════════════════════════ */
      tl.fromTo('#cw1',
        { opacity: 0, x: 380 },
        { opacity: 1, x: 0, duration: 0.52, ease: 'power3.out' },
        4.12
      );
      tl.fromTo('#cw2',
        { opacity: 0, x: -380 },
        { opacity: 1, x: 0, duration: 0.52, ease: 'power3.out' },
        4.55
      );

      /* ════════════════════════════════════════
         PHASE 6 — Hold (5.2 → 8.2s)
      ════════════════════════════════════════ */

      /* ════════════════════════════════════════
         PHASE 7 — Fade to black (8.2 → 9.0s)
      ════════════════════════════════════════ */
      tl.to('#fadeOut', { opacity: 1, duration: 0.7, ease: 'power2.in' }, 8.2);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
