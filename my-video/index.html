<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #292b3d;
      }

      .cards-wrap {
        position: absolute;
        left: 140px;
        top: 120px;
        width: 1640px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        opacity: 0;
      }

      .card {
        background: #111116;
        border-radius: 22px;
        overflow: hidden;
      }

      /* ── Portfolio Balance card ── */
      .pf-card {
        display: flex;
        align-items: stretch;
        height: 224px;
        padding: 38px 52px;
      }

      .pf-left {
        flex-shrink: 0;
        width: 340px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .pf-amount {
        font-size: 86px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -3px;
        line-height: 1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .pf-label {
        font-size: 19px;
        color: #585a70;
        margin-top: 14px;
        font-weight: 400;
      }

      .pf-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-top: 2px;
      }

      .pf-chart-svg {
        flex: 1;
        width: 100%;
        overflow: visible;
      }

      .pf-x-axis {
        display: flex;
        justify-content: space-between;
        padding: 0 1px;
        margin-top: 8px;
      }

      .pf-x-axis span {
        font-size: 19px;
        color: #44465a;
        font-weight: 400;
      }

      /* ── Views on YouTube card ── */
      .views-card {
        height: 224px;
        padding: 36px 52px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: translateY(62px);
      }

      .views-arrow {
        position: absolute;
        top: 36px;
        left: 52px;
        font-size: 30px;
        color: #ffffff;
        line-height: 1;
        font-weight: 300;
      }

      .views-label {
        position: absolute;
        bottom: 36px;
        left: 52px;
        font-size: 18px;
        color: #8082a0;
        font-weight: 400;
      }

      .views-period {
        position: absolute;
        bottom: 36px;
        right: 52px;
        font-size: 18px;
        color: #585a70;
      }

      /* Canvas slot counter — self-clips, no DOM overflow */
      #slotCanvas {
        display: block;
        width: 1536px;
        height: 148px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div class="cards-wrap" id="cardsWrap">

        <!-- Portfolio Balance card -->
        <div class="card pf-card">
          <div class="pf-left">
            <div class="pf-amount" id="pfAmount">$2,933</div>
            <div class="pf-label">Portfolio Balance</div>
          </div>
          <div class="pf-right">
            <svg class="pf-chart-svg" viewBox="0 0 1160 108"
                 preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"   stop-color="#4ade80" stop-opacity="0.16"/>
                  <stop offset="100%" stop-color="#4ade80" stop-opacity="0.00"/>
                </linearGradient>
              </defs>
              <path d="M 0,72 C 22,76 46,88 72,86 C 96,84 115,80 138,70
                       C 158,60 172,96 194,94 C 214,92 235,60 258,52
                       C 278,46 298,62 320,72 C 340,82 358,68 378,48
                       C 398,30 418,36 440,54 C 460,70 474,62 492,52
                       C 510,42 526,44 550,58 C 572,70 585,74 606,68
                       C 626,62 640,52 662,48 C 682,44 698,36 722,44
                       C 744,52 756,58 778,48 C 798,40 812,32 834,30
                       C 856,28 868,36 890,42 C 912,48 928,40 950,34
                       C 970,28 986,20 1010,18 C 1042,15 1075,11 1160,8
                       L 1160,108 L 0,108 Z"
                fill="url(#areaGrad)"/>
              <path d="M 0,72 C 22,76 46,88 72,86 C 96,84 115,80 138,70
                       C 158,60 172,96 194,94 C 214,92 235,60 258,52
                       C 278,46 298,62 320,72 C 340,82 358,68 378,48
                       C 398,30 418,36 440,54 C 460,70 474,62 492,52
                       C 510,42 526,44 550,58 C 572,70 585,74 606,68
                       C 626,62 640,52 662,48 C 682,44 698,36 722,44
                       C 744,52 756,58 778,48 C 798,40 812,32 834,30
                       C 856,28 868,36 890,42 C 912,48 928,40 950,34
                       C 970,28 986,20 1010,18 C 1042,15 1075,11 1160,8"
                fill="none" stroke="#4ade80" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="pf-x-axis">
              <span>Mo</span><span>Tu</span><span>We</span>
              <span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
            </div>
          </div>
        </div>

        <!-- YouTube Views card -->
        <div class="card views-card" id="viewsCard">
          <div class="views-arrow">&#x2191;</div>
          <canvas id="slotCanvas" width="1536" height="148"></canvas>
          <div class="views-label">Views on Youtube</div>
          <div class="views-period">For 2024/2025</div>
        </div>

      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* ── Helpers ── */
      function fmtDollar(n) {
        return '$' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      }
      function fmtCounter(n) {
        var s = Math.max(0, Math.round(n)).toString().padStart(9, '0');
        return s.slice(0, 3) + ',' + s.slice(3, 6) + ',' + s.slice(6, 9);
      }

      /* ── Canvas slot machine ── */
      var TARGET  = 750000000;
      var STEPS   = 80;
      var stepSz  = TARGET / STEPS;
      var ROW_H   = 148;
      var canvas  = document.getElementById('slotCanvas');
      var ctx     = canvas.getContext('2d');
      var CW      = 1536;
      var CH      = ROW_H;

      function drawSlot(rawVal, progress) {
        ctx.clearRect(0, 0, CW, CH);

        var v          = Math.max(0, Math.min(TARGET, rawVal));
        var stepF      = v / stepSz;
        var stepIdx    = Math.floor(stepF);
        var subFrac    = stepF - stepIdx;
        var speed      = Math.pow(Math.max(0, 1 - progress), 0.6);

        var currVal = Math.round(Math.min(TARGET, stepIdx * stepSz));
        var nextVal = Math.round(Math.min(TARGET, (stepIdx + 1) * stepSz));

        /* current row scrolls up; next row enters from below */
        var currY = CH / 2 - subFrac * ROW_H * speed;
        var nextY = CH / 2 + ROW_H   - subFrac * ROW_H * speed;

        ctx.font         = 'bold 112px system-ui, -apple-system, sans-serif';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';

        /* next row (fades in as sub-step progresses) */
        if (speed > 0.02 && subFrac > 0) {
          ctx.globalAlpha = subFrac * speed;
          ctx.fillStyle   = '#4ade80';
          ctx.fillText(fmtCounter(nextVal), CW / 2, nextY);
        }

        /* current row */
        ctx.globalAlpha = 1;
        ctx.fillStyle   = '#4ade80';
        ctx.fillText(fmtCounter(currVal), CW / 2, currY);
      }

      /* initial frame: "000,000,000" */
      drawSlot(0, 0);

      /* ── Portfolio counter ── */
      var pfObj = { val: 2933 };
      var pfEl  = document.getElementById('pfAmount');

      /* ── GSAP Timeline ── */
      var tl = gsap.timeline({ paused: true });

      /* 0.0s — cards fade in */
      tl.to('#cardsWrap', { opacity: 1, duration: 0.45, ease: 'power2.out' }, 0);

      /* 0.0–2.5s — portfolio count-up */
      tl.to(pfObj, {
        val: 7980,
        duration: 2.5,
        ease: 'power2.out',
        onUpdate: function () { pfEl.textContent = fmtDollar(pfObj.val); }
      }, 0);

      /* 1.2s — views card slides up */
      tl.to('#viewsCard', {
        opacity: 1, y: 0,
        duration: 0.5, ease: 'power2.out'
      }, 1.2);

      /* 1.8–4.6s — slot machine count-up */
      var cntObj = { val: 0 };
      tl.to(cntObj, {
        val: TARGET,
        duration: 2.8,
        ease: 'power2.out',
        onUpdate: function () {
          drawSlot(cntObj.val, cntObj.val / TARGET);
        },
        onComplete: function () {
          drawSlot(TARGET, 1);
        }
      }, 1.8);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
