<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: Georgia, 'Times New Roman', serif;
      }

      #stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
        transform-origin: center center;
      }

      /* ── Backgrounds ───────────────────────────────────────────── */
      #bg-void {
        position: absolute; inset: 0;
        background: #000;
        z-index: 0;
      }

      #bg-warm {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 130% 100% at 50% 35%,
            #f7f3ec 0%, #f0ebe0 40%, #e8e2d6 75%, #ddd7ca 100%);
        opacity: 0;
        z-index: 1;
      }

      /* ── Arc Light ─────────────────────────────────────────────── */
      #arc-light {
        position: absolute;
        width: 1100px; height: 900px;
        top: -180px; left: -500px;
        background: radial-gradient(
          ellipse 55% 65% at 38% 38%,
          rgba(255, 249, 237, 0.42) 0%,
          rgba(255, 244, 220, 0.18) 40%,
          transparent 70%
        );
        opacity: 0;
        z-index: 2;
        pointer-events: none;
      }

      /* ── Ambient Particles ─────────────────────────────────────── */
      .pt {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        z-index: 3;
      }

      /* ── Circular Ring (behind bottle) ─────────────────────────── */
      #chart-ring {
        position: absolute;
        left: 580px; top: 160px;
        width: 760px; height: 760px;
        opacity: 0;
        z-index: 4;
        pointer-events: none;
      }

      /* ── Bottle ─────────────────────────────────────────────────── */
      #bottle-wrapper {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        z-index: 5;
      }

      /* ── Charts ─────────────────────────────────────────────────── */
      #chart-left {
        position: absolute;
        left: 130px; top: 390px;
        opacity: 0;
        z-index: 6;
      }

      #chart-right {
        position: absolute;
        right: 130px; top: 400px;
        opacity: 0;
        z-index: 6;
      }

      /* ── Annotation Lines ───────────────────────────────────────── */
      #annotations {
        position: absolute;
        inset: 0;
        overflow: visible;
        opacity: 0;
        z-index: 7;
        pointer-events: none;
      }

      /* ── Structural Grid Lines ──────────────────────────────────── */
      #structural {
        position: absolute;
        inset: 0;
        overflow: visible;
        opacity: 0;
        z-index: 8;
        pointer-events: none;
      }

      /* ── Subtitles ──────────────────────────────────────────────── */
      .sub {
        position: absolute;
        bottom: 88px;
        left: 50%;
        transform: translateX(-50%);
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 300;
        font-style: italic;
        font-size: 26px;
        color: rgba(45, 38, 28, 0.88);
        letter-spacing: 0.38em;
        opacity: 0;
        white-space: nowrap;
        z-index: 10;
        pointer-events: none;
      }

      /* ── Chart SVG base styles ──────────────────────────────────── */
      .chart-axis {
        stroke: rgba(110, 100, 82, 0.28);
        stroke-width: 0.8;
        fill: none;
      }
      .chart-grid {
        stroke: rgba(110, 100, 82, 0.12);
        stroke-width: 0.6;
        stroke-dasharray: 4 6;
        fill: none;
      }
      .chart-label {
        fill: rgba(90, 80, 62, 0.42);
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        font-size: 13px;
        letter-spacing: 0.12em;
      }
      .chart-value {
        fill: rgba(90, 80, 62, 0.58);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 12px;
        font-weight: 300;
      }
      .chart-heading {
        fill: rgba(80, 70, 52, 0.35);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      /* Number count-up labels on line chart */
      .pt-label {
        fill: #3a3020;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 14px;
        font-weight: 400;
        opacity: 0;
      }
      .pt-dot {
        fill: rgba(88, 78, 60, 0.68);
        opacity: 0;
      }
    </style>
  </head>

  <body>
    <div
      id="root"
      data-composition-id="aesop-film"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
      style="overflow:hidden;"
    >
      <div id="stage" data-layout-allow-overflow="true">

        <!-- ══ Backgrounds ══════════════════════════════════════════ -->
        <div id="bg-void"></div>
        <div id="bg-warm"></div>
        <div id="arc-light" data-layout-allow-overflow="true"></div>

        <!-- ══ Particles (16 fixed positions) ══════════════════════ -->
        <div class="pt" id="pt1"  style="width:3px;height:3px;background:rgba(210,200,182,0.38);top:18%;left:8%"></div>
        <div class="pt" id="pt2"  style="width:2px;height:2px;background:rgba(195,186,168,0.32);top:72%;left:6%"></div>
        <div class="pt" id="pt3"  style="width:4px;height:4px;background:rgba(218,208,190,0.28);top:34%;left:14%"></div>
        <div class="pt" id="pt4"  style="width:2px;height:2px;background:rgba(200,190,172,0.35);top:55%;left:22%"></div>
        <div class="pt" id="pt5"  style="width:3px;height:3px;background:rgba(212,202,185,0.30);top:25%;left:78%"></div>
        <div class="pt" id="pt6"  style="width:2px;height:2px;background:rgba(205,196,178,0.33);top:68%;left:85%"></div>
        <div class="pt" id="pt7"  style="width:4px;height:4px;background:rgba(215,205,187,0.26);top:12%;left:92%"></div>
        <div class="pt" id="pt8"  style="width:2px;height:2px;background:rgba(198,188,170,0.36);top:82%;left:90%"></div>
        <div class="pt" id="pt9"  style="width:3px;height:3px;background:rgba(208,198,180,0.29);top:44%;left:3%"></div>
        <div class="pt" id="pt10" style="width:2px;height:2px;background:rgba(202,192,175,0.34);top:88%;left:48%"></div>
        <div class="pt" id="pt11" style="width:3px;height:3px;background:rgba(216,206,188,0.27);top:8%;left:56%"></div>
        <div class="pt" id="pt12" style="width:2px;height:2px;background:rgba(206,196,178,0.31);top:60%;left:66%"></div>
        <div class="pt" id="pt13" style="width:4px;height:4px;background:rgba(210,200,183,0.25);top:78%;left:32%"></div>
        <div class="pt" id="pt14" style="width:2px;height:2px;background:rgba(196,187,169,0.37);top:38%;left:95%"></div>
        <div class="pt" id="pt15" style="width:3px;height:3px;background:rgba(214,204,186,0.28);top:92%;left:15%"></div>
        <div class="pt" id="pt16" style="width:2px;height:2px;background:rgba(204,194,176,0.33);top:5%;left:39%"></div>

        <!-- ══ Circular Ring (centered behind product) ═══════════════ -->
        <svg id="chart-ring" class="clip" data-start="14" data-duration="24" data-track-index="4"
             viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer arc — partial, ~220° -->
          <circle id="ring-outer"
            cx="380" cy="380" r="310"
            fill="none"
            stroke="rgba(110,100,82,0.22)"
            stroke-width="0.8"
            stroke-dasharray="1948"
            stroke-dashoffset="1948"
            stroke-linecap="round"
            transform="rotate(-100, 380, 380)"
          />
          <!-- Inner arc — opposite rotation -->
          <circle id="ring-inner"
            cx="380" cy="380" r="268"
            fill="none"
            stroke="rgba(110,100,82,0.16)"
            stroke-width="0.6"
            stroke-dasharray="1684"
            stroke-dashoffset="1684"
            stroke-linecap="round"
            transform="rotate(60, 380, 380)"
          />
          <!-- Small tick marks on ring -->
          <g id="ring-ticks" opacity="0" stroke="rgba(100,90,72,0.28)" stroke-width="0.7">
            <line x1="380" y1="68"  x2="380" y2="85" />
            <line x1="680" y1="220" x2="668" y2="235" />
            <line x1="680" y1="540" x2="668" y2="525" />
            <line x1="380" y1="692" x2="380" y2="675" />
            <line x1="80"  y1="540" x2="92"  y2="525" />
            <line x1="80"  y1="220" x2="92"  y2="235" />
          </g>
          <!-- Tiny labels on ring -->
          <g id="ring-labels" opacity="0">
            <text class="chart-heading" x="392" y="62" text-anchor="start">ORIGIN</text>
            <text class="chart-heading" x="694" y="228" text-anchor="start">TEXTURE</text>
            <text class="chart-heading" x="694" y="548" text-anchor="start">FORM</text>
            <text class="chart-heading" x="360" y="712" text-anchor="end">FINISH</text>
          </g>
        </svg>

        <!-- ══ Glass Bottle ══════════════════════════════════════════ -->
        <div id="bottle-wrapper" class="clip" data-start="5" data-duration="40" data-track-index="5">
          <svg width="172" height="416" viewBox="0 0 172 416" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g-body" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"   stop-color="#cec8bc" stop-opacity="0.82"/>
                <stop offset="12%"  stop-color="#ddd8ce" stop-opacity="0.92"/>
                <stop offset="45%"  stop-color="#e6e1d7" stop-opacity="0.88"/>
                <stop offset="72%"  stop-color="#d4cfc5" stop-opacity="0.74"/>
                <stop offset="100%" stop-color="#c6c0b4" stop-opacity="0.62"/>
              </linearGradient>
              <linearGradient id="g-liquid" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#e8d8b2" stop-opacity="0.48"/>
                <stop offset="55%"  stop-color="#dac898" stop-opacity="0.40"/>
                <stop offset="100%" stop-color="#ccb882" stop-opacity="0.34"/>
              </linearGradient>
              <linearGradient id="g-neck" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"   stop-color="#cec8bc" stop-opacity="0.88"/>
                <stop offset="40%"  stop-color="#ddd8ce" stop-opacity="0.94"/>
                <stop offset="100%" stop-color="#c8c2b6" stop-opacity="0.78"/>
              </linearGradient>
              <filter id="f-soft">
                <feGaussianBlur stdDeviation="0.4"/>
              </filter>
            </defs>

            <!-- Ground shadow -->
            <ellipse cx="86" cy="410" rx="58" ry="7" fill="rgba(130,118,100,0.12)"/>

            <!-- Body -->
            <rect x="22" y="104" width="128" height="298" rx="7" fill="url(#g-body)" filter="url(#f-soft)"/>

            <!-- Liquid interior -->
            <rect x="30" y="168" width="112" height="228" rx="4" fill="url(#g-liquid)"/>

            <!-- Left primary highlight -->
            <rect x="28" y="112" width="11" height="282" rx="5.5" fill="rgba(255,252,245,0.52)"/>

            <!-- Right secondary highlight -->
            <rect x="130" y="124" width="5" height="258" rx="2.5" fill="rgba(255,252,245,0.18)"/>

            <!-- Subtle inner edge (right) -->
            <rect x="138" y="116" width="3" height="276" rx="1.5" fill="rgba(180,170,155,0.14)"/>

            <!-- Top body highlight edge -->
            <rect x="22" y="104" width="128" height="3" rx="1.5" fill="rgba(255,252,244,0.38)"/>

            <!-- Liquid surface meniscus -->
            <ellipse cx="86" cy="168" rx="56" ry="3" fill="rgba(255,248,228,0.28)"/>

            <!-- Neck -->
            <rect x="54" y="58" width="64" height="52" rx="6" fill="url(#g-neck)" filter="url(#f-soft)"/>
            <rect x="60" y="64" width="9" height="40" rx="4.5" fill="rgba(255,252,245,0.38)"/>

            <!-- Cap -->
            <rect x="58" y="30" width="56" height="32" rx="5" fill="#b8b0a2"/>
            <rect x="64" y="36" width="7" height="22" rx="3.5" fill="rgba(255,252,244,0.22)"/>

            <!-- Cap top highlight -->
            <rect x="58" y="30" width="56" height="3" rx="1.5" fill="rgba(210,202,190,0.5)"/>

            <!-- Bottom body edge -->
            <rect x="22" y="399" width="128" height="3" rx="1.5" fill="rgba(150,140,124,0.28)"/>

            <!-- Glass ripple highlight (animates) -->
            <rect id="bottle-ripple"
              x="28" y="140" width="116" height="60" rx="4"
              fill="rgba(255,252,244,0)"
            />
          </svg>
        </div>

        <!-- ══ Line Chart (left) ══════════════════════════════════════ -->
        <div id="chart-left" class="clip" data-start="12" data-duration="26" data-track-index="6" data-layout-allow-overflow="true">
          <svg width="360" height="290" viewBox="0 0 360 290" xmlns="http://www.w3.org/2000/svg">

            <!-- Heading -->
            <text class="chart-heading" x="42" y="14" text-anchor="start">PERCEPTION CHANGE</text>

            <!-- Grid lines -->
            <line class="chart-grid" x1="42" y1="40"  x2="42"  y2="248"/>
            <line class="chart-grid" x1="42" y1="248" x2="340" y2="248"/>
            <line class="chart-grid" x1="42" y1="185" x2="340" y2="185"/>
            <line class="chart-grid" x1="42" y1="122" x2="340" y2="122"/>
            <line class="chart-grid" x1="42" y1="60"  x2="340" y2="60"/>

            <!-- Axes -->
            <line class="chart-axis" x1="40" y1="38"  x2="40"  y2="250"/>
            <line class="chart-axis" x1="40" y1="250" x2="342" y2="250"/>

            <!-- Y-axis labels -->
            <text class="chart-value" x="34" y="252" text-anchor="end">0</text>
            <text class="chart-value" x="34" y="188" text-anchor="end">25</text>
            <text class="chart-value" x="34" y="125" text-anchor="end">50</text>
            <text class="chart-value" x="34" y="63"  text-anchor="end">75</text>

            <!-- X-axis labels -->
            <text class="chart-value" x="42"  y="265" text-anchor="middle">0s</text>
            <text class="chart-value" x="117" y="265" text-anchor="middle">5s</text>
            <text class="chart-value" x="192" y="265" text-anchor="middle">10s</text>
            <text class="chart-value" x="267" y="265" text-anchor="middle">15s</text>

            <!-- Area fill under curve (very subtle) -->
            <path id="line-area"
              d="M 42,248 C 68,244 94,232 117,223
                 C 140,214 168,196 192,179
                 C 216,162 244,126 267,98
                 C 286,76 310,56 335,38
                 L 335,248 Z"
              fill="rgba(160,148,124,0.06)"
              opacity="0"
            />

            <!-- Data curve -->
            <path id="line-path"
              d="M 42,248 C 68,244 94,232 117,223
                 C 140,214 168,196 192,179
                 C 216,162 244,126 267,98
                 C 286,76 310,56 335,38"
              fill="none"
              stroke="rgba(100,90,72,0.65)"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-dasharray="1500"
              stroke-dashoffset="1500"
            />

            <!-- Data point dots (fade in after curve draws) -->
            <circle class="pt-dot" id="dot1" cx="42"  cy="248" r="3.5"/>
            <circle class="pt-dot" id="dot2" cx="117" cy="223" r="3.5"/>
            <circle class="pt-dot" id="dot3" cx="192" cy="179" r="3.5"/>
            <circle class="pt-dot" id="dot4" cx="267" cy="98"  r="3.5"/>
            <circle class="pt-dot" id="dot5" cx="335" cy="38"  r="3.5"/>

            <!-- Data labels -->
            <text class="pt-label" id="lbl1" x="50"  y="245" text-anchor="start">10</text>
            <text class="pt-label" id="lbl2" x="125" y="220" text-anchor="start">25</text>
            <text class="pt-label" id="lbl3" x="200" y="176" text-anchor="start">45</text>
            <text class="pt-label" id="lbl4" x="275" y="95"  text-anchor="start">70</text>
          </svg>
        </div>

        <!-- ══ Bar Chart (right) ══════════════════════════════════════ -->
        <div id="chart-right" class="clip" data-start="13" data-duration="25" data-track-index="7" data-layout-allow-overflow="true">
          <svg width="340" height="270" viewBox="0 0 340 270" xmlns="http://www.w3.org/2000/svg">

            <!-- Heading -->
            <text class="chart-heading" x="130" y="14" text-anchor="start">MATERIAL EVALUATION</text>

            <!-- Axis -->
            <line class="chart-axis" x1="128" y1="24" x2="128" y2="250"/>
            <line class="chart-axis" x1="128" y1="250" x2="330" y2="250"/>

            <!-- Bar tracks (background) -->
            <rect x="130" y="36"  width="190" height="24" rx="2" fill="rgba(180,170,155,0.08)"/>
            <rect x="130" y="86"  width="190" height="24" rx="2" fill="rgba(180,170,155,0.08)"/>
            <rect x="130" y="136" width="190" height="24" rx="2" fill="rgba(180,170,155,0.08)"/>
            <rect x="130" y="186" width="190" height="24" rx="2" fill="rgba(180,170,155,0.08)"/>

            <!-- Bar fills (animate width from 0) -->
            <rect id="bar-hydration"
              x="130" y="36" width="0" height="24" rx="2"
              fill="rgba(110,100,82,0.42)"
            />
            <rect id="bar-texture"
              x="130" y="86" width="0" height="24" rx="2"
              fill="rgba(110,100,82,0.36)"
            />
            <rect id="bar-absorption"
              x="130" y="136" width="0" height="24" rx="2"
              fill="rgba(110,100,82,0.33)"
            />
            <rect id="bar-clarity"
              x="130" y="186" width="0" height="24" rx="2"
              fill="rgba(110,100,82,0.46)"
            />

            <!-- Bar labels (left) -->
            <text class="chart-label" x="122" y="53"  text-anchor="end">HYDRATION</text>
            <text class="chart-label" x="122" y="103" text-anchor="end">TEXTURE</text>
            <text class="chart-label" x="122" y="153" text-anchor="end">ABSORPTION</text>
            <text class="chart-label" x="122" y="203" text-anchor="end">CLARITY</text>

            <!-- Percentage values (appear after bars) -->
            <text class="pt-label" id="pct-hydration"   x="326" y="53"  text-anchor="end">85</text>
            <text class="pt-label" id="pct-texture"     x="326" y="103" text-anchor="end">72</text>
            <text class="pt-label" id="pct-absorption"  x="326" y="153" text-anchor="end">68</text>
            <text class="pt-label" id="pct-clarity"     x="326" y="203" text-anchor="end">90</text>

            <!-- X-axis scale -->
            <line class="chart-grid" x1="177.5" y1="24" x2="177.5" y2="250"/>
            <line class="chart-grid" x1="225"   y1="24" x2="225"   y2="250"/>
            <line class="chart-grid" x1="272.5" y1="24" x2="272.5" y2="250"/>
            <text class="chart-value" x="177.5" y="264" text-anchor="middle">25</text>
            <text class="chart-value" x="225"   y="264" text-anchor="middle">50</text>
            <text class="chart-value" x="272.5" y="264" text-anchor="middle">75</text>
            <text class="chart-value" x="320"   y="264" text-anchor="middle">100</text>
          </svg>
        </div>

        <!-- ══ Annotation Lines (20–30s) ═════════════════════════════ -->
        <svg id="annotations" class="clip" data-start="20" data-duration="15" data-track-index="8"
             width="1920" height="1080" viewBox="0 0 1920 1080">
          <!-- Left: bottle to line chart -->
          <line id="ann-left"
            x1="870" y1="540" x2="492" y2="490"
            stroke="rgba(100,90,72,0.25)"
            stroke-width="0.7"
            stroke-linecap="round"
            stroke-dasharray="500"
            stroke-dashoffset="500"
          />
          <!-- Right: bottle to bar chart -->
          <line id="ann-right"
            x1="1052" y1="540" x2="1450" y2="490"
            stroke="rgba(100,90,72,0.25)"
            stroke-width="0.7"
            stroke-linecap="round"
            stroke-dasharray="500"
            stroke-dashoffset="500"
          />
          <!-- Up: bottle to ring -->
          <line id="ann-up"
            x1="960" y1="330" x2="960" y2="165"
            stroke="rgba(100,90,72,0.20)"
            stroke-width="0.6"
            stroke-linecap="round"
            stroke-dasharray="200"
            stroke-dashoffset="200"
          />
          <!-- Small endpoint dots -->
          <circle id="ann-dot-l" cx="492" cy="490" r="2.5"
            fill="rgba(100,90,72,0.3)" opacity="0"/>
          <circle id="ann-dot-r" cx="1450" cy="490" r="2.5"
            fill="rgba(100,90,72,0.3)" opacity="0"/>
          <circle id="ann-dot-u" cx="960" cy="165" r="2.5"
            fill="rgba(100,90,72,0.22)" opacity="0"/>
        </svg>

        <!-- ══ Structural Grid Lines (30–38s morph) ════════════════════ -->
        <svg id="structural" class="clip" data-start="30" data-duration="8" data-track-index="9"
             width="1920" height="1080" viewBox="0 0 1920 1080">
          <!-- Horizontal lines -->
          <line id="sl-h1" x1="120" y1="270"  x2="1800" y2="270"
            stroke="rgba(120,110,92,0.28)" stroke-width="0.6" fill="none"
            stroke-dasharray="1800" stroke-dashoffset="1800"/>
          <line id="sl-h2" x1="120" y1="540"  x2="1800" y2="540"
            stroke="rgba(120,110,92,0.22)" stroke-width="0.5" fill="none"
            stroke-dasharray="1800" stroke-dashoffset="1800"/>
          <line id="sl-h3" x1="120" y1="810"  x2="1800" y2="810"
            stroke="rgba(120,110,92,0.28)" stroke-width="0.6" fill="none"
            stroke-dasharray="1800" stroke-dashoffset="1800"/>
          <!-- Vertical lines -->
          <line id="sl-v1" x1="480"  y1="80" x2="480"  y2="1000"
            stroke="rgba(120,110,92,0.22)" stroke-width="0.5" fill="none"
            stroke-dasharray="960" stroke-dashoffset="960"/>
          <line id="sl-v2" x1="960"  y1="80" x2="960"  y2="1000"
            stroke="rgba(120,110,92,0.28)" stroke-width="0.6" fill="none"
            stroke-dasharray="960" stroke-dashoffset="960"/>
          <line id="sl-v3" x1="1440" y1="80" x2="1440" y2="1000"
            stroke="rgba(120,110,92,0.22)" stroke-width="0.5" fill="none"
            stroke-dasharray="960" stroke-dashoffset="960"/>
          <!-- Cross-hair fine marks at intersections -->
          <g stroke="rgba(110,100,82,0.18)" stroke-width="0.5" fill="none">
            <line x1="475" y1="265" x2="485" y2="275"/>
            <line x1="485" y1="265" x2="475" y2="275"/>
            <line x1="955" y1="265" x2="965" y2="275"/>
            <line x1="965" y1="265" x2="955" y2="275"/>
            <line x1="1435" y1="535" x2="1445" y2="545"/>
            <line x1="1445" y1="535" x2="1435" y2="545"/>
          </g>
        </svg>

        <!-- ══ Subtitles ══════════════════════════════════════════════ -->
        <!-- "There is no urgency here." -->
        <div id="sub-1" class="sub clip" data-start="2" data-duration="3" data-track-index="10">
          There is no urgency here.
        </div>

        <!-- "Only matter, as it is." -->
        <div id="sub-2" class="sub clip" data-start="7" data-duration="4" data-track-index="10">
          Only matter, as it is.
        </div>

        <!-- "Texture defines memory." -->
        <div id="sub-3" class="sub clip" data-start="14" data-duration="6" data-track-index="10">
          Texture defines memory.
        </div>

        <!-- "Form begins to dissolve into structure." -->
        <div id="sub-4" class="sub clip" data-start="22" data-duration="8" data-track-index="10">
          Form begins to dissolve into structure.
        </div>

        <!-- "Structure replaces object." -->
        <div id="sub-5" class="sub clip" data-start="32" data-duration="5" data-track-index="10">
          Structure replaces object.
        </div>

        <!-- "A quiet study of material." -->
        <div id="sub-6" class="sub clip" data-start="39" data-duration="5" data-track-index="10"
             style="letter-spacing:0.45em; font-size:24px;">
          A quiet study of material.
        </div>

      </div><!-- #stage -->
    </div><!-- #root -->

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── 0–5s  VOID INTRO ──────────────────────────────────────────
      // Black → warm space
      tl.to("#bg-warm", { opacity: 1, duration: 4.2, ease: "power1.inOut" }, 0.4);

      // Arc light: sweep left → right
      tl.set("#arc-light", { x: 0, opacity: 0 });
      tl.to("#arc-light", { opacity: 1, duration: 2, ease: "power1.in" }, 0.2);
      tl.to("#arc-light", { x: 900, duration: 44, ease: "none" }, 0);  // slow continuous drift

      // Particles: persistent throughout, staggered drift
      const ptIds = ["pt1","pt2","pt3","pt4","pt5","pt6","pt7","pt8",
                     "pt9","pt10","pt11","pt12","pt13","pt14","pt15","pt16"];
      const ptDy    = [-28,-22,-32,-18,-26,-20,-30,-16,-24,-28,-20,-32,-18,-26,-22,-24];
      const ptDelay = [0.6,1.2,0.3,1.8,0.8,1.5,0.4,2.0,1.0,0.7,1.4,0.2,1.7,0.9,0.5,1.1];
      const ptDur   = [6.5,5.8,7.2,6.0,5.5,6.8,7.0,5.2,6.3,6.7,5.9,7.4,6.1,5.6,6.9,7.1];
      const ptRep   = [6,  7,  5,  7,  8,  6,  5,  8,  7,  6,  7,  5,  7,  8,  6,  5  ];

      ptIds.forEach((id, i) => {
        tl.to(`#${id}`, {
          opacity: 0.7,
          y: ptDy[i],
          duration: ptDur[i],
          repeat: ptRep[i],
          yoyo: true,
          ease: "sine.inOut"
        }, ptDelay[i]);
      });

      // Sub 1: "There is no urgency here."
      tl.to("#sub-1", { opacity: 0.2, duration: 1.2, ease: "power1.in" },  2.0);
      tl.to("#sub-1", { opacity: 0,   duration: 0.9, ease: "power1.out" }, 4.2);

      // ── 5–12s  OBJECT PRESENCE ───────────────────────────────────
      // Bottle shadow→light reveal: opacity 0→1 over 3s
      tl.to("#bottle-wrapper", { opacity: 1, duration: 3.2, ease: "power1.inOut" }, 5.0);

      // Subtle glass ripple (bottle highlight pulses twice)
      tl.to("#bottle-ripple", {
        attr: { fill: "rgba(255,252,244,0.18)" },
        duration: 1.2, ease: "power1.inOut"
      }, 8.0);
      tl.to("#bottle-ripple", {
        attr: { fill: "rgba(255,252,244,0)" },
        duration: 1.2, ease: "power1.out"
      }, 9.2);
      tl.to("#bottle-ripple", {
        attr: { fill: "rgba(255,252,244,0.12)" },
        duration: 1.0, ease: "sine.inOut"
      }, 10.4);
      tl.to("#bottle-ripple", {
        attr: { fill: "rgba(255,252,244,0)" },
        duration: 0.9, ease: "power1.out"
      }, 11.4);

      // Sub 2: "Only matter, as it is."
      tl.to("#sub-2", { opacity: 0.2, duration: 1.2, ease: "power1.in" },  7.2);
      tl.to("#sub-2", { opacity: 0,   duration: 0.9, ease: "power1.out" }, 10.8);

      // ── 12–20s  INFOGRAPHIC ENTRY ─────────────────────────────────
      // Ring fades in
      tl.to("#chart-ring", { opacity: 1, duration: 1.4, ease: "power1.inOut" }, 12.0);
      tl.to("#ring-outer", { strokeDashoffset: 0, duration: 4.0, ease: "power1.inOut" }, 12.4);
      tl.to("#ring-inner", { strokeDashoffset: 0, duration: 3.4, ease: "power1.inOut" }, 13.0);
      tl.to("#ring-ticks",  { opacity: 1, duration: 1.2, ease: "power1.in" }, 15.5);
      tl.to("#ring-labels", { opacity: 1, duration: 1.0, ease: "power1.in" }, 16.5);

      // Line chart fades in + draws
      tl.to("#chart-left",  { opacity: 1, duration: 1.2, ease: "power1.in" }, 12.5);
      tl.to("#line-area",   { opacity: 1, duration: 1.0, ease: "power1.in" }, 13.2);
      tl.to("#line-path",   { strokeDashoffset: 0, duration: 4.2, ease: "power1.inOut" }, 12.8);
      // Data dots appear sequentially as curve passes each
      tl.to("#dot1", { opacity: 1, duration: 0.4, ease: "power2.out" }, 13.0);
      tl.to("#dot2", { opacity: 1, duration: 0.4, ease: "power2.out" }, 14.0);
      tl.to("#dot3", { opacity: 1, duration: 0.4, ease: "power2.out" }, 15.0);
      tl.to("#dot4", { opacity: 1, duration: 0.4, ease: "power2.out" }, 16.0);
      tl.to("#dot5", { opacity: 1, duration: 0.4, ease: "power2.out" }, 16.8);
      // Labels count up (simply fade in)
      tl.to("#lbl1", { opacity: 1, duration: 0.5 }, 13.1);
      tl.to("#lbl2", { opacity: 1, duration: 0.5 }, 14.1);
      tl.to("#lbl3", { opacity: 1, duration: 0.5 }, 15.1);
      tl.to("#lbl4", { opacity: 1, duration: 0.5 }, 16.1);
      // Line breathing pulse (7 cycles × 2.2s ≈ 15.4s → 16–31s)
      tl.to("#line-path", {
        opacity: 0.5, duration: 1.1,
        repeat: 13, yoyo: true,
        ease: "sine.inOut"
      }, 17.5);

      // Bar chart fades in, bars grow
      tl.to("#chart-right", { opacity: 1, duration: 1.2, ease: "power1.in" }, 13.2);
      tl.fromTo("#bar-hydration",  { attr: { width: 0 } }, { attr: { width: 161 }, duration: 1.6, ease: "power2.out" }, 13.8);
      tl.fromTo("#bar-texture",    { attr: { width: 0 } }, { attr: { width: 137 }, duration: 1.6, ease: "power2.out" }, 14.2);
      tl.fromTo("#bar-absorption", { attr: { width: 0 } }, { attr: { width: 129 }, duration: 1.6, ease: "power2.out" }, 14.6);
      tl.fromTo("#bar-clarity",    { attr: { width: 0 } }, { attr: { width: 171 }, duration: 1.6, ease: "power2.out" }, 15.0);
      // Percentages appear after bars complete
      tl.to("#pct-hydration",  { opacity: 1, duration: 0.6, ease: "power1.in" }, 15.5);
      tl.to("#pct-texture",    { opacity: 1, duration: 0.6, ease: "power1.in" }, 15.9);
      tl.to("#pct-absorption", { opacity: 1, duration: 0.6, ease: "power1.in" }, 16.3);
      tl.to("#pct-clarity",    { opacity: 1, duration: 0.6, ease: "power1.in" }, 16.7);

      // Sub 3: "Texture defines memory."
      tl.to("#sub-3", { opacity: 0.2, duration: 1.2, ease: "power1.in" },  14.2);
      tl.to("#sub-3", { opacity: 0,   duration: 0.9, ease: "power1.out" }, 19.4);

      // ── 20–30s  SYSTEM EXPANSION ──────────────────────────────────
      // Annotation lines draw
      tl.to("#annotations", { opacity: 1, duration: 0.8 }, 20.0);
      tl.to("#ann-left",  { strokeDashoffset: 0, duration: 1.6, ease: "power1.out" }, 20.4);
      tl.to("#ann-right", { strokeDashoffset: 0, duration: 1.6, ease: "power1.out" }, 20.8);
      tl.to("#ann-up",    { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" }, 21.2);
      tl.to("#ann-dot-l", { opacity: 1, duration: 0.5 }, 22.0);
      tl.to("#ann-dot-r", { opacity: 1, duration: 0.5 }, 22.2);
      tl.to("#ann-dot-u", { opacity: 1, duration: 0.5 }, 22.4);

      // Charts slightly expand outward from product center
      tl.to("#chart-left",  { x: -18, duration: 4, ease: "power1.inOut" }, 22);
      tl.to("#chart-right", { x:  18, duration: 4, ease: "power1.inOut" }, 22);
      tl.to("#chart-ring",  { scale: 1.04, transformOrigin: "50% 50%", duration: 4, ease: "power1.inOut" }, 22);

      // Sub 4: "Form begins to dissolve into structure."
      tl.to("#sub-4", { opacity: 0.2, duration: 1.2, ease: "power1.in" },  22.2);
      tl.to("#sub-4", { opacity: 0,   duration: 0.9, ease: "power1.out" }, 29.2);

      // ── 30–38s  GRID MORPH / DECONSTRUCT ─────────────────────────
      // Structural grid draws in
      tl.to("#structural", { opacity: 1, duration: 1.0 }, 30.0);
      tl.to("#sl-h1", { strokeDashoffset: 0, duration: 2.0, ease: "power1.inOut" }, 30.2);
      tl.to("#sl-h3", { strokeDashoffset: 0, duration: 2.0, ease: "power1.inOut" }, 30.5);
      tl.to("#sl-h2", { strokeDashoffset: 0, duration: 2.0, ease: "power1.inOut" }, 30.8);
      tl.to("#sl-v1", { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" }, 31.0);
      tl.to("#sl-v3", { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" }, 31.2);
      tl.to("#sl-v2", { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" }, 31.5);

      // Charts stretch and dissolve into structure
      tl.to("#chart-left", {
        scaleX: 1.8, x: -120, opacity: 0,
        duration: 3.2, ease: "power2.in",
        transformOrigin: "right center"
      }, 31.0);
      tl.to("#chart-right", {
        scaleX: 1.8, x: 120, opacity: 0,
        duration: 3.2, ease: "power2.in",
        transformOrigin: "left center"
      }, 31.0);
      tl.to("#chart-ring", {
        scale: 1.35, opacity: 0,
        duration: 3.5, ease: "power2.in",
        transformOrigin: "50% 50%"
      }, 31.2);
      tl.to("#annotations", { opacity: 0, duration: 2.0, ease: "power1.in" }, 31.4);

      // Bottle becomes translucent silhouette
      tl.to("#bottle-wrapper", { opacity: 0.22, duration: 3.5, ease: "power1.inOut" }, 32.8);

      // Camera slow zoom out (stage scale 1→0.96)
      tl.to("#stage", { scale: 0.963, transformOrigin: "960px 540px", duration: 7, ease: "power1.inOut" }, 32.0);

      // Structural grid fades out
      tl.to("#structural", { opacity: 0, duration: 2.5, ease: "power1.out" }, 35.2);

      // Sub 5: "Structure replaces object."
      tl.to("#sub-5", { opacity: 0.2, duration: 1.2, ease: "power1.in" },  32.2);
      tl.to("#sub-5", { opacity: 0,   duration: 0.9, ease: "power1.out" }, 36.8);

      // ── 38–45s  FINAL STILLNESS ───────────────────────────────────
      // Arc light dims to near nothing
      tl.to("#arc-light", { opacity: 0.06, duration: 4.5, ease: "power2.out" }, 38.0);

      // Bottle fades to faint outline
      tl.to("#bottle-wrapper", { opacity: 0.12, duration: 3.5, ease: "power2.inOut" }, 38.0);

      // Particle drift continues but slows (already animated via repeats above)
      // Warm bg remains — space persists

      // Sub 6: "A quiet study of material." — only brand sentence
      tl.to("#sub-6", { opacity: 0.2, duration: 1.5, ease: "power1.in" },  39.2);
      tl.to("#sub-6", { opacity: 0,   duration: 1.5, ease: "power1.out" }, 42.5);

      // Final fade to stillness
      tl.to("#bg-warm", { opacity: 0.88, duration: 4, ease: "power1.inOut" }, 38.5);

      window.__timelines["aesop-film"] = tl;
    </script>
  </body>
</html>
