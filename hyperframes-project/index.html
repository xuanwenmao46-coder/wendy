<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0c0b09; }
    </style>
  </head>
  <body>
    <div
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="62"
    >
      <!-- Beat 1: Hook — "The Number" (0.00 – 4.00s) -->
      <div
        id="beat-1"
        data-composition-id="beat-1-hook"
        data-composition-src="compositions/beat-1-hook.html"
        data-start="0"
        data-duration="4.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Beat 2: The Cliff — "Peak at 25" (4.00 – 10.00s) -->
      <div
        id="beat-2"
        data-composition-id="beat-2-cliff"
        data-composition-src="compositions/beat-2-cliff.html"
        data-start="4.0"
        data-duration="6.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Beat 3: The Three Walls (10.00 – 18.00s) -->
      <div
        id="beat-3"
        data-composition-id="beat-3-walls"
        data-composition-src="compositions/beat-3-walls.html"
        data-start="10.0"
        data-duration="8.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>


      <!-- Beat 3b: Overcrowded Calendar (18.00 – 26.00s) -->
      <div
        id="beat-3b"
        data-composition-id="beat-3b-calendar"
        data-composition-src="compositions/beat-3b-calendar.html"
        data-start="18.0"
        data-duration="8.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Beat 4: The Cost (18.00 – 24.00s) -->
      <div
        id="beat-4"
        data-composition-id="beat-4-cost"
        data-composition-src="compositions/beat-4-cost.html"
        data-start="26.0"
        data-duration="6.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Beat 4b: ECharts Pie — Carbon Footprint (24.00 – 32.00s) -->
      <div
        id="beat-4b"
        data-composition-id="beat-4b-pie"
        data-composition-src="compositions/beat-4b-pie.html"
        data-start="32.0"
        data-duration="8.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Beat 4c: ECharts Bar — Fabric Degradation (32.00 – 40.00s) -->
      <div
        id="beat-4c"
        data-composition-id="beat-4c-bar"
        data-composition-src="compositions/beat-4c-bar.html"
        data-start="40.0"
        data-duration="8.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>


      <!-- Beat 4d: Unsent Message — Typing (38.00 – 48.00s) -->
      <div
        id="beat-4d"
        data-composition-id="beat-4d-typing"
        data-composition-src="compositions/beat-4d-typing.html"
        data-start="48.0"
        data-duration="10.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Beat 5: CTA — "The Way Forward" (40.00 – 46.00s) -->
      <div
        id="beat-5"
        data-composition-id="beat-5-cta"
        data-composition-src="compositions/beat-5-cta.html"
        data-start="58.0"
        data-duration="4.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

            <!-- ─── Drum guide track — track-index 2 ─── -->
      <!-- Generated by: node generate-drums.js                     -->
      <!-- Swap audio/drums.wav for real BGM when ready —          -->
      <!-- same filename, same track-index, Hyperframes picks it up -->
      <audio id="drums" data-start="0" data-duration="62" data-track-index="2" data-volume="0.7" src="audio/drums.wav"></audio>

      <!-- ─── TTS Narration tracks (per-beat, no BGM) ─── -->
      <!-- Generated by: node generate-tts.js --provider openai -->

      <audio id="vo-1" data-start="0"    data-duration="4.0" data-track-index="0" data-volume="1" src="audio/beat-1.mp3"></audio>
      <audio id="vo-2" data-start="4.0"  data-duration="6.0" data-track-index="0" data-volume="1" src="audio/beat-2.mp3"></audio>
      <audio id="vo-3" data-start="10.0" data-duration="8.0" data-track-index="0" data-volume="1" src="audio/beat-3.mp3"></audio>
      <audio id="vo-4" data-start="26.0" data-duration="6.0" data-track-index="0" data-volume="1" src="audio/beat-4.mp3"></audio>
      <audio id="vo-4b" data-start="32.0" data-duration="8.0" data-track-index="0" data-volume="1" src="audio/beat-4b.mp3"></audio>
      <audio id="vo-4c" data-start="40.0" data-duration="8.0" data-track-index="0" data-volume="1" src="audio/beat-4c.mp3"></audio>
      <audio id="vo-5" data-start="58.0" data-duration="4.0" data-track-index="0" data-volume="1" src="audio/beat-5.mp3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
