<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920, height=1080"/>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1920px; height:1080px; overflow:hidden; background:#0c0b09; font-family:'DM Sans',sans-serif; }

    .scene {
      width:1920px; height:1080px;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }

    /* warmer radial glow behind number */
    .glow {
      position:absolute;
      width:1100px; height:1100px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(201,98,42,0.28) 0%, rgba(201,98,42,0.10) 40%, transparent 70%);
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }

    /* flowing light beam */
    .flow-beam {
      position:absolute;
      top:-10%; left:0;
      width:300px; height:120%;
      background:linear-gradient(90deg,
        transparent 0%,
        rgba(201,98,42,0.05) 25%,
        rgba(255,190,120,0.12) 50%,
        rgba(201,98,42,0.05) 75%,
        transparent 100%);
      transform:skewX(-12deg);
      pointer-events:none;
      z-index:50;
      will-change:transform;
    }
    /* ambient glow on accents */
    .glow-accent { text-shadow: 0 0 40px rgba(201,98,42,0.5), 0 0 80px rgba(201,98,42,0.2); }

    .eyebrow {
      font-size:28px; letter-spacing:8px; text-transform:uppercase;
      color:rgba(232,132,78,0.7);
      margin-bottom:40px;
      opacity:0;
    }

    .big-number {
      font-family:'DM Serif Display', serif;
      font-size:340px; line-height:1;
      color:#c9622a;
      opacity:0;
      position:relative;
    }

    .percent {
      font-family:'DM Serif Display', serif;
      font-size:160px; color:#c9622a;
      vertical-align:super; line-height:1;
    }

    .caption {
      font-size:52px; font-weight:300;
      color:rgba(250,248,243,0.6);
      margin-top:32px;
      letter-spacing:1px;
      opacity:0;
      max-width:1000px; text-align:center; line-height:1.4;
    }

    /* horizontal rule that draws in */
    .rule {
      width:0; height:2px;
      background:#c9622a;
      margin:40px auto 0;
      opacity:0.5;
    }
  </style>
</head>
<body>
<div class="scene" id="scene">
  <div class="flow-beam" id="flow-beam"></div>
  <div class="glow"></div>
  <p class="eyebrow" id="eyebrow">A story about connection</p>
  <div class="big-number glow-accent" id="num">49<span class="percent">%</span></div>
  <div class="rule" id="rule"></div>
  <p class="caption" id="cap">of adults now have 3 or fewer close friends</p>
</div>

<script>
  window.__timelines = window.__timelines || {};

  var tl = gsap.timeline({ paused: true });

  tl
    .fromTo('#flow-beam', { x:-400 }, { x:2500, duration:2.0, ease:'power1.inOut' }, 0)

    .to('#eyebrow', { opacity:1, y:0, duration:0.5, ease:'power2.out' }, 0.2)
    .from('#eyebrow', { y:20 }, 0.2)

    .to('#num', { opacity:1, scale:1, duration:0.6, ease:'expo.out' }, 0.6)
    .from('#num', { scale:0.7 }, 0.6)

    .to('#rule', { width:320, opacity:0.5, duration:0.5, ease:'power2.out' }, 1.1)

    .to('#cap', { opacity:1, y:0, duration:0.5, ease:'power2.out' }, 1.3)
    .from('#cap', { y:20 }, 1.3)

    /* hold, then fade full scene for transition */
    .to('#scene', { opacity:0, duration:0.4, ease:'power2.in' }, 3.6);

  window.__timelines["beat-1-hook"] = tl;
</script>
</body>
</html>
